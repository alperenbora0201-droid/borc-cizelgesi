    case 'kapandi':return {t:'Kapandı',c:'s-mute'};
    case 'devretti':return {t:'Devretti',c:'s-mute'};
    case 'tutar':return {t:'Tutar yok',c:'s-soon'};
    case 'kismi':return o.late?{t:'Kısmi · gecikti',c:'s-late'}:{t:'Kısmi',c:'s-info'};
    case 'gecikti':return {t:dayDiff(o.due,TODAY)+' gün gecikti',c:'s-late'};
    case 'yakin':{const k=dayDiff(TODAY,o.due);return {t:k===0?'Bugün':k===1?'Yarın':k+' gün',c:'s-soon'};}
    default:return {t:'Bekliyor',c:'s-mute'};
  }
}
function planHTML(d){
  const rows=planRows(d);
  if(!rows.length)return '<p class="quiet">Plan boş.</p>';
  let list=rows,before=null,more=0;
  if(isFin(d)&&!S.planAll&&rows.length>12){
    const fo=rows.findIndex(o=>!isDoneSt(o.st));
    let start=fo<0?rows.length-12:Math.max(0,fo-2);
    start=Math.min(start,Math.max(0,rows.length-12));
    if(start>0){const hid=rows.slice(0,start);before={from:hid[0].n,to:hid[hid.length-1].n,sum:hid.reduce((s,o)=>s+o.tot,0),once:hid.every(o=>o.st==='once')};}
    list=rows.slice(start,start+12);
    more=rows.length-(start+12);
  }
  let h='<ol class="plan">';
  if(before)h+=`<li><button type="button" class="prow done" data-action="plan-all"><span class="pn tnum">${before.from===before.to?before.from:before.from+'–'+before.to}</span><span class="pd">${before.to-before.from+1} taksit</span><span class="pa tnum">${fmt(before.sum)}</span><span class="ps s-mute">${before.once?'Önceden':'Ödendi'}</span></button></li>`;
  h+=list.map(o=>{const ps=planSt(o);return `<li><button type="button" class="prow${isDoneSt(o.st)?' done':''}${o.late?' is-late':''}" data-action="occ" data-id="${esc(d.id)}" data-n="${o.n}" aria-label="${esc(perLabel(d,o.n)+', vade '+dLong(o.due)+', '+fmt(o.tot)+' TL, '+ST_LABEL[o.st])}"><span class="pn tnum">${d.kind==='taksit'?o.n:''}</span><span class="pd">${dShortY(o.due)} <i>${GUNK[wd(o.due)]}</i></span><span class="pa tnum">${o.est&&o.tot>0?'~':''}${fmt(o.tot)}</span><span class="ps ${ps.c}">${ps.t}</span></button></li>`;}).join('');
  h+='</ol>';
  if(more>0||before)h+=`<button type="button" class="btn ghost block" data-action="plan-all">Bütün taksitleri göster (${rows.length})</button>`;
  else if(S.planAll&&isFin(d)&&rows.length>12)h+='<button type="button" class="btn ghost block" data-action="plan-all">Kısa listeye dön</button>';
  if(!isFin(d))h+='<p class="hint">Son 3 ve sonraki 12 dönem gösterilir. Bir döneme dokunup ödeme ya da tutar girebilirsin.</p>';
  return h;
}
function ledgerHTML(d){
  const L=ledger(d);
  if(!L.rows.length)return '<p class="quiet">Henüz hareket yok.</p>';
  let h=`<ul class="ledger">${L.rows.map(r=>`<li class="lg${r.adj?' adj':''}"><span class="lg-d tnum">${dDot(r.date)}</span><span class="lg-a tnum ${r.cr!=null?'cr':'dr'}">${r.cr!=null?'−'+fmt(r.cr):'+'+fmt(r.dr)}</span><span class="lg-t">${esc(r.desc)}</span><span class="lg-b tnum">Kalan ${fmt(r.bal)}</span></li>`).join('')}</ul>`;
  h+=`<dl class="ltot"><div><dt>Toplam borç</dt><dd>${fmt(L.tdr)}</dd></div><div><dt>Toplam ödeme</dt><dd>−${fmt(L.tcr)}</dd></div>${L.adj?`<div><dt>${L.adj<0?'Kapama indirimi':'Kapama farkı'}</dt><dd>${L.adj<0?'−':'+'}${fmt(Math.abs(L.adj))}</dd></div>`:''}<div class="grand"><dt>${isFin(d)?'Kalan borç':'Ödenmemiş'}</dt><dd>${fmt(L.bal)}</dd></div></dl>`;
  h+='<p class="hint">+ borç kaydı, − ödeme. Her satırın altındaki rakam o satırdan sonra kalan bakiye.</p>';
  return h;
}
function viewDetail(d){
  const s=summary(d),day=anchorOf(d);
  let desc;
  if(d.kind==='taksit')desc=`${d.count} taksit × ${fmt(d.amount)} ₺ · her ayın ${day}${gunEki(day)}`;
  else if(d.kind==='tek')desc='Tek ödeme · vade '+dLong(d.first);
  else if(d.kind==='kart')desc=`Son ödeme her ayın ${day}${gunEki(day)} · tahmini ekstre ${fmt(d.amount)} ₺`;
  else{const ns=nextStep(d);desc=`${EVERY[d.every]} ${fmt(curAmt(d))} ₺ · ayın ${day}${gunEki(day)}${d.end?' · bitiş '+dShortY(d.end):''}${ns?` · ${ymLabel(ns.from)} itibarıyla ${fmt(ns.amount)} ₺`:''}`;}
  let h=`<div class="detail-nav"><button type="button" class="back" data-action="back">${ICON.left}Borçlar</button><button type="button" class="link" data-action="edit" data-id="${esc(d.id)}">Düzenle</button></div>`;
  h+=`<section class="dt-head"><p class="eyebrow">${esc(KINDS[d.kind].label)} · ${esc(CATS[d.cat].label)} · ${BOOKS[d.book]}</p><h1 class="dt-name">${esc(d.name)}${sampleTag(d)}</h1><p class="sub">${esc(desc)}</p><p class="prio-line"><span class="badge b-${d.prio}">${PRIOS[d.prio].label}</span>${esc(PRIOS[d.prio].hint)}</p></section>`;
  h+='<section class="card">';
  if(s.fin){
    h+=kv3([['Toplam',fmt(s.plan)],['Ödenen',fmt(s.paidSum)],['Kalan',fmt(s.kalan)]]);
    const pct=s.plan?Math.round((s.plan-s.kalan)/s.plan*100):0;
    h+=pbar(d.closedAt?100:pct,'Yüzde '+pct+' ödendi');
    const bits=[];
    if(d.kind==='taksit')bits.push(`${s.paidCount}/${d.count} taksit ödendi`,`son taksit ${ymLabel(ymOf(s.last))}`);
    if(d.closedAt)bits.push(`${dShortY(d.closedAt)} tarihinde kapatıldı`);
    if(s.before>0)bits.push(`${d.paidBefore} taksit (${fmt(s.before)} ₺) takipten önce ödendi`);
    if(bits.length)h+=`<p class="hint">${esc(bits.join(' · '))}</p>`;
  }else{
    h+=kv3([[d.kind==='kart'?'Tahmini ekstre':'Dönem tutarı',fmt(d.kind==='sabit'?curAmt(d):d.amount)],['Bu yıl ödenen',fmt(s.yearPaid)],['Geciken',fmt(s.arrears)]]);
  }
  const nx=s.firstLate||s.next;
  if(nx&&!d.closedAt)h+=`<div class="nextbox${nx.late?' late':''}"><div><span class="eyebrow">${nx.late?'Gecikmiş':'Sıradaki'}</span><b>${esc(perLabel(d,nx.n))} · ${esc(dMed(nx.due))}</b><span class="tnum">${nx.est?'~':''}${fmt(nx.rest||nx.tot)} ₺</span></div>${actHTML(nx)}</div>`;
  if(d.note)h+=`<p class="hint">Not: ${esc(d.note)}</p>`;
  h+='</section>';
  h+=costHTML(d);
  h+=`<div class="seg sm" role="group" aria-label="Görünüm"><button type="button" data-action="dtab" data-v="plan" aria-pressed="${S.dtab==='plan'}">Ödeme planı</button><button type="button" data-action="dtab" data-v="hareket" aria-pressed="${S.dtab==='hareket'}">Hareketler</button></div>`;
  h+=S.dtab==='hareket'?ledgerHTML(d):planHTML(d);
  h+='<div class="actions">';
  if(isFin(d))h+=d.closedAt?`<button type="button" class="btn" data-action="reopen-debt" data-id="${esc(d.id)}">Yeniden aç</button>`:`<button type="button" class="btn" data-action="close-debt" data-id="${esc(d.id)}">${d.kind==='tek'?'Borcu kapat':'Erken kapat'}</button>`;
  else h+=d.end?`<button type="button" class="btn" data-action="restart-debt" data-id="${esc(d.id)}">Bitişi kaldır</button>`:`<button type="button" class="btn" data-action="end-debt" data-id="${esc(d.id)}">Bu aydan sonra bitir</button>`;
  h+=`<button type="button" class="btn" data-action="edit" data-id="${esc(d.id)}">Düzenle</button><button type="button" class="btn danger" data-action="del-debt" data-id="${esc(d.id)}">Sil</button></div>`;
  return h;
}

/* ───────── Analiz ───────── */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function viewAnaliz(){
  const debts=vis(),cur=ymOf(TODAY),tot=totals(debts),fp=tot.free?P(tot.free):null,ciro=S.settings.ciro;
  const ser=[];for(let i=0;i<12;i++){const m=monthData(ymAdd(cur,i),debts);ser.push({ym:m.ym,total:m.total,paid:m.paid,occs:m.occs});}
  CHART=ser;if(S.sel!=null&&!ser[S.sel])S.sel=null;
  const y12=ser.reduce((s,x)=>s+x.total,0);
  let h=bookSeg()+`<div class="vhead"><h1 class="vtitle">Analiz</h1><p class="sub">Borçlarının bugünkü resmi ve önümüzdeki 12 ay.</p></div>`;
  const mLeft=fp?ymDiff(cur,ymOf(tot.free)):0;
  h+=`<div class="kpis">
    <div class="kpi dark"><span>Kalan borç</span><b>${fmt0(tot.finRest)} ₺</b><i>kredi, taksit ve tek ödemeler</i></div>
    <div class="kpi"><span>Borçsuz kalma</span><b>${fp?AYK[fp.m-1]+' '+fp.y:'—'}</b><i>${fp?(mLeft>0?mLeft+' ay sonra':'bu ay'):'açık kredi yok'}</i></div>
    <div class="kpi"><span>Aylık yük</span><b>${fmt0(tot.monthly)} ₺</b><i>taksit, kart ve düzenli ödemeler</i></div>
    <div class="kpi"><span>${ciro?'Borç / ciro':'12 ay toplamı'}</span><b>${ciro?'%'+Math.round(tot.monthly/ciro*100):fmt0(y12)+' ₺'}</b><i>${ciro?'aylık yükün cirona oranı':'önümüzdeki 12 ayın ödemeleri'}</i></div>
  </div>`;
  if(!ciro)h+=`<p class="hint">Ayarlardan aylık ortalama cironu girersen borç yükünün cirona oranını da görürsün. <button type="button" class="link" data-action="settings">Ciro gir ›</button></p>`;
  h+=`<section class="sec"><div class="sec-h"><h2>Önümüzdeki 12 ay</h2><span class="v">${fmt(y12)}</span></div>
    <div class="chart"><div class="chart-host" id="chart-host"></div><div class="chart-info" id="chart-info"></div>
    <details class="tview" data-k="openTable"${S.openTable?' open':''}><summary>Tablo olarak gör</summary><div class="tv-wrap"><table class="tv"><thead><tr><th>Ay</th><th class="r">Toplam</th><th class="r">Ödenen</th>${ciro?'<th class="r">Ciroya oran</th>':''}</tr></thead><tbody>
    ${ser.map(x=>`<tr><td>${ymLabel(x.ym)}</td><td class="r">${fmt(x.total)}</td><td class="r">${fmt(x.paid)}</td>${ciro?`<td class="r">%${Math.round(x.total/ciro*100)}</td>`:''}</tr>`).join('')}</tbody></table></div></details></div></section>`;
  const rl=relief(debts);
  if(rl.length){
    h+=`<section class="sec"><div class="sec-h"><h2>Ne zaman rahatlarsın</h2></div><ol class="relief">${rl.map(r=>{const nxt=ymAdd(r.ym,1),after=monthData(nxt,debts).total;return `<li><button type="button" class="rl" data-action="detail" data-id="${esc(r.d.id)}"><span class="rl-m">${AYK[+r.ym.slice(5,7)-1]}<i>${r.ym.slice(0,4)}</i></span><span class="rl-b"><b>${esc(r.d.name)}</b> biter<span class="hint">${ymLabel(nxt)} itibarıyla aylık ödemeler ≈ ${fmt0(after)} ₺</span></span><span class="rl-v">−${fmt0(r.drop)} ₺<i>aylık</i></span></button></li>`;}).join('')}</ol>${fp?`<p class="hint">Bütün kredi, taksit ve tek ödemeler ${ymLabel(ymOf(tot.free))} sonunda biter.</p>`:''}</section>`;
  }
  const pend=[...overdue(debts),...monthData(cur,debts).occs.filter(o=>o.rest>0&&!o.late)];
  if(pend.length){
    const tp=sumRest(pend);
    h+=`<section class="sec"><div class="sec-h"><h2>Para sıkışırsa sıra</h2><span class="v">${fmt(tp)}</span></div><p class="hint">Bu ayın ödenmemiş ödemeleri, önceliğe göre. Önceliği borcun düzenleme ekranından değiştirebilirsin.</p><div class="pgs">`;
    for(const pr of ['kritik','onemli','esnek']){
      const items=pend.filter(o=>o.d.prio===pr).sort((a,b)=>(b.late-a.late)||(a.due<b.due?-1:a.due>b.due?1:0));
      if(!items.length)continue;
      h+=`<div class="pg"><div class="pg-h"><b>${PRIOS[pr].label}</b><span>${fmt(sumRest(items))} ₺</span></div><p class="hint">${PRIOS[pr].hint}</p><ul class="ml">${items.map(o=>`<li class="${o.late?'late':''}"><button type="button" data-action="occ" data-id="${esc(o.d.id)}" data-n="${o.n}"><span class="d">${o.late?'Gecikmiş':dShort(o.due)}</span><span>${esc(o.d.name)}</span><span class="a">${o.est?'~':''}${fmt(o.rest)}</span></button></li>`).join('')}</ul></div>`;
    }
    h+='</div></section>';
  }
  const loans=debts.filter(d=>d.kind==='taksit'&&!d.closedAt).map(d=>({d,c:loanCost(d),s:summary(d)})).filter(x=>x.s.kalan>0);
  if(loans.length){
    const withC=loans.filter(x=>x.c&&x.c.r!=null).sort((a,b)=>b.c.r-a.c.r),missing=loans.filter(x=>!x.c);
    h+=`<section class="sec"><div class="sec-h"><h2>Kredilerin maliyeti</h2></div>`;
    if(withC.length)h+=`<ul class="costs">${withC.map((x,i)=>`<li><button type="button" class="cost-r" data-action="detail" data-id="${esc(x.d.id)}"><b>${esc(x.d.name)}${i===0&&withC.length>1?'<span class="badge">En pahalı</span>':''}</b><span class="r">≈ %${pctTR(x.c.r)} <span class="eyebrow">aylık</span></span><span class="hint">Faiz ve masraf ${fmt0(Math.max(0,x.c.interest))} ₺ · bugün kapatırsan ≈ ${fmt0(x.c.payoff)} ₺ (${fmt0(x.c.saving)} ₺ az)</span></button></li>`).join('')}</ul>`;
    if(missing.length)h+=`<p class="hint">${esc(missing.map(x=>x.d.name).join(', '))} için çekilen tutarı girersen faiz maliyeti ve erken kapama tahmini de çıkar. <button type="button" class="link" data-action="edit" data-id="${esc(missing[0].d.id)}" data-focus="principal">Ekle ›</button></p>`;
    h+='</section>';
  }
  const cm=new Map();
  for(const x of ser)for(const o of x.occs)if(o.tot>0)cm.set(o.d.cat,(cm.get(o.d.cat)||0)+o.tot);
  const cats=[...cm.entries()].sort((a,b)=>b[1]-a[1]);
  if(cats.length&&y12>0){
    const mx=cats[0][1];
    h+=`<section class="sec"><div class="sec-h"><h2>Para nereye gidiyor</h2><span class="eyebrow">12 ay</span></div><ul class="hbars">${cats.map(([k,v])=>`<li class="hb"><span class="hb-l">${CATS[k].label}</span><span class="hb-v">${fmt0(v)} ₺<i>%${Math.round(v/y12*100)}</i></span><span class="hb-track"><span class="hb-fill" style="width:${(v/mx*100).toFixed(1)}%"></span></span></li>`).join('')}</ul></section>`;
  }
  h+=journalHTML(debts);
  h+=`<section class="sec"><div class="sec-h"><h2>Paylaş ve yedekle</h2></div><div class="exp">
    <button type="button" class="btn" data-action="share-month" data-ym="${cur}">${ICON.share}Bu ayın listesini WhatsApp'ta paylaş</button>
    <button type="button" class="btn" data-action="exp-pays">${ICON.copy}Ödeme defteri · Excel (CSV)</button>
    <button type="button" class="btn" data-action="backup">${ICON.shield}Tam yedek al</button>
  </div></section>`;
  return h;
}
function journalHTML(debts){
  const ids=new Set(debts.map(d=>d.id)),yr=TODAY.slice(0,4);
  const pays=S.payments.filter(p=>ids.has(p.debtId)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));
  const mm={banka:0,nakit:0,kart:0};let ysum=0;
  for(const p of pays)if(p.date.slice(0,4)===yr){mm[p.method]+=p.amount;ysum+=p.amount;}
  let h=`<section class="sec"><div class="sec-h"><h2>Ödeme defteri</h2><span class="v">${yr} · ${fmt(ysum)}</span></div>`;
  if(!pays.length)return h+'<p class="quiet">Henüz ödeme kaydı yok.</p></section>';
  if(ysum)h+=`<p class="hint">${yr} yılında: ${Object.keys(METHODS).filter(k=>mm[k]).map(k=>`${METHODS[k]} ${fmt0(mm[k])} ₺`).join(' · ')}</p>`;
  const months=[];for(const p of pays){const ym=ymOf(p.date);let g=months[months.length-1];if(!g||g.ym!==ym){g={ym,items:[]};months.push(g);}g.items.push(p);}
  const show=S.journalAll?months:months.slice(0,3);
  for(const g of show){
    const sum=g.items.reduce((s,p)=>s+p.amount,0),nk=g.items.filter(p=>p.method==='nakit').reduce((s,p)=>s+p.amount,0);
    h+=`<div class="jm"><div class="jm-h"><b>${ymLabel(g.ym)}</b><span>${fmt(sum)} ₺</span></div>${nk?`<p class="jm-mix">Nakitten ${fmt0(nk)} ₺</p>`:''}<ul class="jl">${g.items.map(p=>{const d=DMAP.get(p.debtId);return `<li class="${p.method==='nakit'?'cash':''}"><span class="d">${dShort(p.date)}</span><span class="t">${esc(d?d.name:'Silinmiş borç')}<i>${esc((d?perLabel(d,p.n):'')+' · '+METHODS[p.method]+(p.note?' · '+p.note:''))}</i></span><span class="a">${fmt(p.amount)}</span></li>`;}).join('')}</ul></div>`;
  }
  if(months.length>3)h+=`<button type="button" class="btn ghost block" data-action="journal-all">${S.journalAll?'Son 3 ayı göster':`Daha eski ödemeler (${months.length-3} ay)`}</button>`;
  return h+'</section>';
}
function drawChart(){
  const host=$('#chart-host'),info=$('#chart-info');
  if(!host||!CHART)return;
  const ser=CHART,max=Math.max(0,...ser.map(x=>x.total));
  if(max<=0){host.innerHTML='<p class="quiet">Önümüzdeki 12 ayda ödeme görünmüyor.</p>';host.style.minHeight='0';if(info)info.hidden=true;return;}
  const W=Math.max(260,Math.floor(host.clientWidth||320)),H=206,padL=48,padR=6,padT=20,padB=36;
  const pw=W-padL-padR,ph=H-padT-padB,step=niceStep(max/3),top=Math.ceil(max/step)*step;
  const Y=v=>padT+ph-(v/top)*ph,base=padT+ph,band=pw/ser.length,bw=Math.min(24,Math.max(8,band*0.62));
  const f=v=>(Math.round(v*10)/10).toString();
  const rp=(x,y,w,hh,cls)=>{const r=Math.min(4,w/2,hh);return `<path class="${cls}" d="M${f(x)},${f(y+hh)}V${f(y+r)}A${r},${r} 0 0 1 ${f(x+r)},${f(y)}H${f(x+w-r)}A${r},${r} 0 0 1 ${f(x+w)},${f(y+r)}V${f(y+hh)}Z"/>`;};
  const si=S.sel!=null?S.sel:0;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Önümüzdeki 12 ayın ödeme toplamları">`;
  for(let v=0;v<=top+step/2;v+=step){const y=Math.round(Y(v))+.5;s+=`<line class="g" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text class="ax" x="${padL-8}" y="${y+3.5}" text-anchor="end">${v===0?'0':fmtC(v)}</text>`;}
  ser.forEach((x,i)=>{
    const cx=padL+band*i+band/2,x0=cx-bw/2,hh=x.total/top*ph,yt=base-hh;
    if(hh>0)s+=rp(x0,yt,bw,hh,'cb'+(i===si?' sel':''));
    if(i===si&&x.total>0)s+=`<text class="vlab" x="${f(cx)}" y="${f(yt-6)}" text-anchor="middle">${fmtC(x.total)}</text>`;
    const mo=+x.ym.slice(5,7);
    s+=`<text class="ax" x="${f(cx)}" y="${base+14}" text-anchor="middle">${AYK[mo-1]}</text>`;
    if(i===0||mo===1)s+=`<text class="ax yr" x="${f(cx)}" y="${base+28}" text-anchor="middle">${x.ym.slice(0,4)}</text>`;
    s+=`<rect class="hit" x="${f(padL+band*i)}" y="${padT}" width="${f(band)}" height="${ph+padB}" data-action="chart-sel" data-i="${i}" tabindex="0" role="button" aria-label="${esc(ymLabel(x.ym)+': toplam '+fmt(x.total)+' TL')}"/>`;
  });
  s+='</svg>';
  host.innerHTML=s;
  const x=ser[si],k={taksit:0,kart:0,sabit:0,tek:0};for(const o of x.occs)k[o.d.kind]+=o.tot;
  const mix=Object.keys(k).filter(z=>k[z]>0).map(z=>`${KINDS[z].short} ${fmt0(k[z])}`).join(' · ');
  if(info){info.hidden=false;info.innerHTML=`<div class="ci-top"><b>${ymLabel(x.ym)} · ${fmt(x.total)} ₺</b><button type="button" class="link" data-action="open-month" data-ym="${x.ym}">Takvimde aç ›</button></div>${mix?`<span class="ci-mix">${mix}</span>`:''}<span class="hint">Bir aya dokunup ayrıntısını gör. Sarı çubuk seçili ay.</span>`;}
}

/* ───────── alttan açılan sayfalar ───────── */
function openSheet(kind,params){
  SHEET={kind,params:params||{},opener:document.activeElement};
  IMPORT=null;
  renderSheet(true);
  document.documentElement.classList.add('lock');
}
function closeSheet(){
  const op=SHEET&&SHEET.opener;
  SHEET=null;IMPORT=null;
  const el=$('#sheet');el.hidden=true;el.innerHTML='';
  document.documentElement.classList.remove('lock');
  try{if(op&&op.isConnected)op.focus({preventScroll:true});}catch(e){}
}
function renderSheet(first){
  const el=$('#sheet');
  if(!SHEET){el.hidden=true;return;}
  let title='',left='<button type="button" class="bar-btn muted" data-action="sheet-close">Kapat</button>',right='',body='';
  const k=SHEET.kind;
  if(k==='debt'){
    const d=SHEET.params.id?DMAP.get(SHEET.params.id):null;

}
function refreshSheet(){
  if(!SHEET||SHEET.kind==='debt'||SHEET.kind==='text')return;

  document.querySelectorAll('#sheet input[id],#sheet textarea[id]').forEach(i=>{if(i.type==='radio'||i.type==='checkbox')keep[i.id]=i.checked;else if(i.type!=='file')keep[i.id]=i.value;});
  const touched=$('#p-amount')&&$('#p-amount').dataset.touched;
  const body=$('#sheet .panel-body'),sc=body?body.scrollTop:0;
  renderSheet(false);
  for(const id in keep){const i=document.getElementById(id);if(!i)continue;if(i.type==='radio'||i.type==='checkbox')i.checked=keep[id];else i.value=keep[id];}

function pastCount(kind,first,count,every){
  if(!validDate(first)||kind==='tek')return 0;
  let n=idxAtOrBefore({first,every:every||1},addDays(TODAY,-1));
  if(kind==='taksit')n=Math.min(n,count||0);
  return Math.max(0,n);
}

function wireDebtForm(){
  const f=$('#debt-form');if(!f)return;
  const orig=f.dataset.edit?DMAP.get(f.dataset.edit):null;
  const st={pbTouched:!!orig,catTouched:!!orig,prioTouched:!!orig};
  const kindV=()=>{const r=f.querySelector('input[name=kind]:checked');return r?r.value:'taksit';};
  const num=id=>parseInt($('#'+id).value,10);
  const prioHint=()=>{const r=f.querySelector('input[name=prio]:checked');$('#prio-hint').textContent=r?PRIOS[r.value].hint:'';};
  function setCat(c){$('#f-cat').value=c;if(!st.prioTouched){const r=$('#pr-'+CATS[c].prio);if(r)r.checked=true;}prioHint();}
  function renderPicks(){const box=$('#picks');if(!box)return;box.innerHTML='<span class="lab">Hızlı seç</span>'+PICKS[kindV()].map((p,i)=>`<button type="button" class="pick" data-pick="${i}" aria-pressed="false">${esc(p[0])}</button>`).join('');}
  function applyKind(){
    const k=kindV();
    f.querySelectorAll('[data-k]').forEach(el=>{el.hidden=!el.dataset.k.split(' ').includes(k);});
    $('#l-amount').textContent={taksit:'Taksit tutarı ₺',sabit:'Tutar ₺',kart:'Tahmini aylık ekstre ₺',tek:'Tutar ₺'}[k];
    $('#l-first').textContent={taksit:'İlk taksit tarihi',sabit:'İlk ödeme tarihi',kart:'Bu ayın son ödeme tarihi',tek:'Vade tarihi'}[k];
    $('#l-pb').textContent=k==='taksit'?'Ödenmiş taksit':'Ödenmiş dönem';
    const tm=k==='taksit'&&$('#f-tm').checked;
    $('#row-total').hidden=!tm;$('#f-amount').readOnly=tm;
    renderPicks();prioHint();
  }
  function update(){
    const k=kindV(),first=$('#f-first').value,count=num('f-count'),every=num('f-every')||1;
    const pc=pastCount(k,first,k==='taksit'?count:0,k==='sabit'?every:1);
    if(!st.pbTouched)$('#f-pb').value=pc;
    const pb=parseInt($('#f-pb').value||'0',10)||0;
    $('#row-pb').hidden=k==='tek'||!(pc>0||pb>0);
    const ph=$('#pb-hint');
    if(k!=='tek'&&pc>0){ph.hidden=false;ph.textContent=k==='taksit'?`Bu tarihe göre bugünden önce ${pc} taksit var. Hepsini ödediysen ${pc} kalsın; ödemediklerin varsa sayıyı düşür, onlar gecikmiş görünür.`:`Bu tarihe göre bugünden önce ${pc} dönem var. Ödendiyse ${pc} kalsın.`;}
    else ph.hidden=true;
    let amount=parseTL($('#f-amount').value),rem=0;
    if(k==='taksit'&&$('#f-tm').checked){const t=parseTL($('#f-total').value);if(t>0&&count>=1){amount=Math.floor(t/count);rem=t-amount*count;$('#f-amount').value=fmt(amount);}}
    const sc=$('#row-scope');if(sc&&orig)sc.hidden=!(k==='sabit'&&Number.isFinite(amount)&&amount!==curAmt(orig));
    const pv=$('#preview');let x='';
    const day=validDate(first)?P(first).d:null;
    if(!validDate(first)||!(amount>=0)||(k!=='kart'&&!(amount>0)))x='Tutarı ve tarihi girince özet burada görünür.';
    else if(k==='taksit'){
      if(count>=1){
        const last=dueOf({first,every:1},count),totalV=amount*count+rem,remN=Math.max(0,count-pb),remAmt=remN*amount+(remN>0?rem:0);
        x=`<b>${count}</b> taksit × <b>${fmt(amount)}</b> = <b>${fmt(totalV)} ₺</b>${rem?` (son taksit ${fmt(amount+rem)})`:''}<br>Her ayın ${day}${gunEki(day)} · son taksit <b>${ymLabel(ymOf(last))}</b><br>Kalan <b>${remN}</b> taksit, <b>${fmt(remAmt)} ₺</b>`;
        const pr=parseTL($('#f-principal').value);
        if(pr>0){const a=[];for(let i=1;i<=count;i++)a.push(i===count?amount+rem:amount);const r=rateOf(a,pr);x+=`<br>Faiz ve masraf <b>${fmt(Math.max(0,totalV-pr))} ₺</b>${r?` · aylık maliyet ≈ <b>%${pctTR(r)}</b>`:''}`;}
      }else x='Taksit sayısını gir.';
    }
    else if(k==='sabit')x=`${EVERY[every]}, ayın ${day}${gunEki(day)}: <b>${fmt(amount)} ₺</b><br>Yıllık yaklaşık <b>${fmt(Math.round(amount*12/every))} ₺</b>`;
    else if(k==='kart')x=`Her ayın ${day}${gunEki(day)} son ödeme · tahmini <b>${fmt(amount)} ₺</b><br>Ekstre gelince o ayın gerçek tutarını girersin.`;
    else x=`Vade <b>${dLong(first)}</b> · <b>${fmt(amount)} ₺</b>${first<TODAY?' · <span class="neg">vadesi geçmiş</span>':''}`;
    pv.innerHTML=x;
  }
  f.addEventListener('click',e=>{
    const b=e.target.closest('[data-pick]');if(!b)return;
    const p=PICKS[kindV()][+b.dataset.pick];if(!p)return;
    $('#f-name').value=p[0];st.catTouched=true;setCat(p[1]);
    f.querySelectorAll('.pick').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
    update();
    const a=$('#f-amount');if(a&&!a.readOnly)a.focus();
  });
  f.addEventListener('change',e=>{
    const t=e.target;
    if(t.name==='kind'){if(!st.catTouched)setCat(KINDS[t.value].defCat);applyKind();}
    if(t.id==='f-cat'){st.catTouched=true;if(!st.prioTouched){const r=$('#pr-'+CATS[t.value].prio);if(r)r.checked=true;}prioHint();}
    if(t.name==='prio'){st.prioTouched=true;prioHint();}
    if(t.id==='f-tm')applyKind();
    if(t.id==='f-pb')st.pbTouched=true;
    update();
  });
  f.addEventListener('input',e=>{if(e.target.id==='f-pb')st.pbTouched=true;update();});
  f.addEventListener('submit',e=>{e.preventDefault();saveDebt(f);});
  applyKind();update();
}
function setErr(id,msg){const e=$('#e-'+id),i=$('#f-'+id)||$('#'+id);if(e)e.textContent=msg||'';if(i){if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid');}}
async function saveDebt(f){
  f.querySelectorAll('.err').forEach(e=>e.textContent='');
  f.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));
  const kind=f.querySelector('input[name=kind]:checked').value;
  const name=$('#f-name').value.trim(),first=$('#f-first').value;
  const cat=CATS[$('#f-cat').value]?$('#f-cat').value:KINDS[kind].defCat;
  const prio=(f.querySelector('input[name=prio]:checked')||{}).value||CATS[cat].prio;
  const book=(f.querySelector('input[name=book]:checked')||{}).value||'isletme';
  const note=$('#f-note').value.trim().slice(0,300);
  let ok=true;const bad=(id,msg)=>{setErr(id,msg);ok=false;};
  if(!name)bad('name','Bir ad yaz; ör. “Ziraat kredisi”.');
  if(!validDate(first))bad('first','Bir tarih seç.');
  let amount=parseTL($('#f-amount').value),count=1,total=null;
  if(kind==='taksit'){
    count=parseInt($('#f-count').value,10);
    if(!(count>=1&&count<=600))bad('count','1 ile 600 arasında bir sayı gir.');
    if($('#f-tm').checked){total=parseTL($('#f-total').value);if(!(total>0))bad('total','Toplam geri ödemeyi gir.');else if(count>=1)amount=Math.floor(total/count);}
  }
  if(kind==='kart'){if(!Number.isFinite(amount))amount=0;}
  else if(!(amount>0)&&!(kind==='taksit'&&total!=null))bad('amount','Tutarı gir; ör. 4.850,00');
  let pb=0;
  if(kind!=='tek'){pb=parseInt($('#f-pb').value||'0',10);if(!(pb>=0))pb=0;if(kind==='taksit'&&count>=1&&pb>count)bad('pb','Taksit sayısından fazla olamaz.');}
  let end=null;
  if(kind==='sabit'||kind==='kart'){end=$('#f-end').value||null;if(end&&!validDate(end))bad('end','Geçerli bir tarih seç.');else if(end&&validDate(first)&&end<first)bad('end','Bitiş, ilk ödemeden önce olamaz.');}
  let principal=null;
  if(kind==='taksit'){const pr=$('#f-principal').value.trim();if(pr){principal=parseTL(pr);if(!(principal>0)){bad('principal','Tutarı gir ya da boş bırak.');principal=null;}}}
  if(!ok){const e=f.querySelector('[aria-invalid="true"]');if(e){const det=e.closest('details');if(det)det.open=true;e.focus();e.scrollIntoView({block:'center'});}return;}
  const orig=f.dataset.edit?DMAP.get(f.dataset.edit):null;
  const d=orig?JSON.parse(JSON.stringify(orig)):{id:newId('b'),createdAt:Date.now(),overrides:{},steps:[]};
  d.overrides=d.overrides||{};
  Object.assign(d,{kind,name,cat,prio,book,note,first,paidBefore:kind==='tek'?0:pb,principal:kind==='taksit'?principal:null});
  if(kind==='sabit'&&orig&&orig.kind==='sabit'){
    const cur=curAmt(orig);
    if(amount!==cur){const scope=($('#f-scope')||{}).value||'all';if(scope==='all'){d.amount=amount;d.steps=[];}else{d.amount=orig.amount;d.steps=(orig.steps||[]).filter(s=>s.from<scope).concat([{from:scope,amount}]);}}
    else{d.amount=orig.amount;d.steps=orig.steps||[];}
  }else{d.amount=amount;d.steps=[];}
  if(d.autoLast!=null)delete d.overrides[d.autoLast];
  d.autoLast=null;d.total=null;
  if(kind==='taksit'){d.count=count;if(total!=null){d.total=total;const rem=total-amount*count;if(rem>0){d.overrides[count]=amount+rem;d.autoLast=count;}}}
  else d.count=kind==='tek'?1:null;
  d.every=kind==='sabit'?(parseInt($('#f-every').value,10)||1):1;
  d.end=(kind==='sabit'||kind==='kart')?end:null;
  if(!isFin(d))d.closedAt=null;
  try{await Store.putDebt(d);closeSheet();toast(orig?'Değişiklikler kaydedildi':'Eklendi: '+name);}
  catch(e){toast(errText(e));}
}

const DATA_KEY='borc-cizelgesi.v2';
function loadData(){try{const raw=localStorage.getItem(DATA_KEY);if(raw){const j=JSON.parse(raw);if(j&&typeof j==='object'&&j.debts&&j.payments)return j;}}catch(e){}return null;}
function persist(){try{localStorage.setItem(DATA_KEY,JSON.stringify(DATA));return true;}catch(e){return false;}}
function hydrate(){
  S.debts=Object.keys(DATA.debts).map(id=>cleanDebt(id,DATA.debts[id])).filter(Boolean);
  S.payments=Object.keys(DATA.payments).map(id=>cleanPay(id,DATA.payments[id])).filter(Boolean);
  S.settings=cleanSettings(DATA.settings);
  reindex();
}
function commit(mut){
  const backup=JSON.stringify(DATA);
  mut(DATA);
  if(!persist()){DATA=JSON.parse(backup);throw {code:'storage'};}
  hydrate();onData();pushReminders();
}

  async delDebt(id){commit(D=>{for(const k of Object.keys(D.payments))if(D.payments[k].debtId===id)delete D.payments[k];delete D.debts[id];});},

const IDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('borc-cizelgesi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async set(k,v){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>{db.close();rej(tx.error);};});}
};
let remT=0;
function pushReminders(){
  clearTimeout(remT);
  remT=setTimeout(()=>{
    if(!('indexedDB' in window))return;
    try{
      const real=S.debts.filter(d=>!d.sample),items=[];
      for(const o of overdue(real))items.push({date:o.due,name:o.d.name,amount:o.rest});
      for(const o of upcoming(real,TODAY,addDays(TODAY,45)))items.push({date:o.due,name:o.d.name,amount:o.rest||o.tot,est:!!o.est});
      IDB.set('upcoming',{items,on:!!S.settings.remind,updated:Date.now()}).catch(()=>{});
    }catch(e){}
  },300);
}
async function registerPeriodic(){
  try{
    const reg=await navigator.serviceWorker.ready;
    if(!('periodicSync' in reg))return false;
    const st=await navigator.permissions.query({name:'periodic-background-sync'});
    if(st.state!=='granted')return false;
    await reg.periodicSync.register('borc-hatirlat',{minInterval:12*3600*1000});
    return true;
  }catch(e){return false;}
}
async function enableReminders(){
  if(!('Notification' in window)){toast('Bu tarayıcı bildirim göstermiyor.');return;}
  let perm=Notification.permission;
  if(perm!=='granted'){try{perm=await Notification.requestPermission();}catch(e){}}
  if(perm!=='granted'){toast('Bildirim izni verilmedi. Telefon ayarlarından açabilirsin.');return;}
  const bg='serviceWorker' in navigator?await registerPeriodic():false;
  try{await Store.putSettings({remind:true,remindBg:bg});}catch(e){toast(errText(e));return;}
  try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('Hatırlatmalar açık',{body:'Ödeme günü geldiğinde ve geciken olduğunda buraya bildirim gelir.',icon:'icons/icon-192.png',badge:'icons/badge-96.png',tag:'borc-test',lang:'tr'});}catch(e){}
  toast(bg?'Hatırlatmalar açık':'İzin alındı; arka plan kontrolü için uygulamayı ana ekrana kur.');
  refreshSheet();
}
async function disableReminders(){
  try{const reg=await navigator.serviceWorker.ready;if(reg.periodicSync)await reg.periodicSync.unregister('borc-hatirlat');}catch(e){}
  try{await Store.putSettings({remind:false,remindBg:false});toast('Hatırlatmalar kapatıldı');}catch(e){toast(errText(e));}
  refreshSheet();
}

/* ───────── paylaşma / dışa aktarma ───────── */
function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const toCSV=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
function monthCSV(ym){
  const md=monthData(ym,vis());
  const rows=[['Vade','Gün','Borç','Kategori','Kime ait','Dönem','Tutar','Ödenen','Kalan','Durum']];
  for(const o of md.occs)rows.push([dDot(o.due),GUNLER[wd(o.due)],o.d.name,CATS[o.d.cat].label,BOOKS[o.d.book],perLabel(o.d,o.n),csvAmt(o.tot),csvAmt(o.paidEff),csvAmt(o.rest),ST_LABEL[o.st]]);
  rows.push(['','','Toplam','','','',csvAmt(md.total),csvAmt(md.paid),csvAmt(md.rest),'']);
  return toCSV(rows);
}
function paysCSV(){
  const rows=[['Tarih','Borç','Kime ait','Dönem','Tutar','Ödeme yolu','Not']];
  const ps=S.payments.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  for(const p of ps){const d=DMAP.get(p.debtId);rows.push([dDot(p.date),d?d.name:'(silinmiş borç)',d?BOOKS[d.book]:'',d?perLabel(d,p.n):p.n,csvAmt(p.amount),METHODS[p.method],p.note]);}
  return toCSV(rows);
}
function backupJSON(){return JSON.stringify({app:'borc-cizelgesi',version:2,exportedAt:new Date().toISOString(),settings:DATA.settings||{},
  debts:S.debts.map(d=>Object.assign({id:d.id},debtDoc(d))),payments:S.payments.map(p=>Object.assign({id:p.id},payDoc(p)))},null,1);}
function monthText(ym){
  const debts=vis(),md=monthData(ym,debts),lines=[`${ymLabel(ym)} ödemeleri`];
  for(const o of md.occs){const p=P(o.due);lines.push(`${pad2(p.d)} ${AYK[p.m-1]} ${GUNK[wd(o.due)]} · ${o.d.name}${o.d.kind==='taksit'?` (${o.n}/${o.d.count})`:''} · ${o.est?'~':''}${fmt(o.tot)} ₺${isDoneSt(o.st)?' ✓':o.late?' (gecikti)':''}`);}
  lines.push('',`Toplam ${fmt(md.total)} ₺ · Ödenen ${fmt(md.paid)} ₺ · Kalan ${fmt(md.rest)} ₺`);
  if(ym===ymOf(TODAY)){const old=overdue(debts).filter(o=>ymOf(o.due)<ym);if(old.length){lines.push('','Önceki aylardan gecikenler:');for(const o of old)lines.push(`${dShort(o.due)} · ${o.d.name} · ${fmt(o.rest)} ₺`);}}
  return lines.join('\n');
}
function openText(title,hint,text){openSheet('text',{title,hint,text});}
function shareText(text,title){
  if(navigator.share){navigator.share({text,title}).catch(err=>{if(!err||err.name!=='AbortError')openText(title,'Paylaşılamadı; metni seçip kopyalayabilirsin.',text);});return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('Kopyalandı; WhatsApp\'a yapıştırabilirsin'),()=>openText(title,'Metni seçip kopyala.',text));return;}
  openText(title,'Metni seçip kopyala.',text);
}
function downloadFile(file){const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);}
function shareFile(name,text,mime){
  const file=new File([text],name,{type:mime});
  if(navigator.canShare&&navigator.share){
    let ok=false;try{ok=navigator.canShare({files:[file]});}catch(e){}
    if(ok)return navigator.share({files:[file],title:name}).then(()=>'shared',err=>{if(err&&err.name==='AbortError')return 'cancel';downloadFile(file);return 'downloaded';});
  }
  downloadFile(file);
  return Promise.resolve('downloaded');
}
function doBackup(){
  const p=shareFile(`borc-yedek-${TODAY}.txt`,backupJSON(),'text/plain');
  p.then(r=>{if(r==='cancel')return;Store.putMeta({lastBackup:Date.now()}).catch(()=>{});toast(r==='shared'?'Yedek paylaşıldı':'Yedek İndirilenler klasörüne kaydedildi');});
}
function readImport(file){
  file.text().then(txt=>{
    const j=JSON.parse(txt);
    if(!j||!Array.isArray(j.debts))throw new Error('format');
    const debts=[],pays=[];
    for(const x of j.debts){if(!x||!validId(x.id))continue;const c=cleanDebt(x.id,x);if(c)debts.push(c);}
    for(const x of (Array.isArray(j.payments)?j.payments:[])){if(!x||!validId(x.id))continue;const c=cleanPay(x.id,x);if(c)pays.push(c);}
    if(!debts.length&&!pays.length)throw new Error('empty');
    IMPORT={debts,pays,settings:j.settings&&typeof j.settings==='object'?j.settings:null};refreshSheet();
  }).catch(()=>toast('Bu dosya Borç Çizelgesi yedeğine benzemiyor.'));
}
function runImport(){
  if(!IMPORT)return;
  const {debts,pays,settings}=IMPORT,n=debts.length+pays.length;
  try{commit(D=>{for(const d of debts)D.debts[d.id]=debtDoc(d);for(const p of pays)D.payments[p.id]=payDoc(p);if(settings)D.settings=Object.assign({},D.settings,settings);});IMPORT=null;toast(n+' kayıt geri yüklendi');}
  catch(e){toast(errText(e));}
  refreshSheet();
}

/* ───────── çizim ───────── */
let raf=0;
function onData(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render();if(SHEET)refreshSheet();});}
function applyTheme(){
  const t=S.settings.theme,root=document.documentElement;
  if(t==='light'||t==='dark')root.dataset.theme=t;else delete root.dataset.theme;
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=$('meta[name="theme-color"]');if(m)m.setAttribute('content',dark?'#0D1120':'#F3F4F8');
}
function render(){
  TODAY=localToday();
  applyTheme();
  $('#hdr-date').textContent=dLong(TODAY);
  let h=bannersHTML(S.tab==='bugun'&&!S.detail);
  if(!S.debts.length)h+=emptyHTML();
  else h+=S.tab==='takvim'?viewTakvim():S.tab==='borclar'?viewBorclar():S.tab==='analiz'?viewAnaliz():viewBugun();
  $('#view').innerHTML=h;
  document.querySelectorAll('.tab[data-tab]').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(S.tab==='analiz'&&S.debts.length)drawChart();
}
function goTab(tab,keepDetail){
  if(tab==='borclar'&&!keepDetail)S.detail=null;
  S.tab=tab;S.sel=null;LS.set('tab',tab);
  render();window.scrollTo(0,0);
}

/* ───────── bildirim ───────── */
let toastTimer=null,toastFn=null;
function toast(msg,act,fn){
  const el=$('#toast');
  el.innerHTML=`<span class="msg">${esc(msg)}</span>${act?`<button type="button" data-action="toast-act">${esc(act)}</button>`:''}`;
  el.hidden=false;toastFn=fn||null;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;toastFn=null;},act?6500:3400);
}
function armed(btn,label){
  if(btn.dataset.armed==='1'){btn.dataset.armed='';return true;}
  btn.dataset.armed='1';btn.dataset.orig=btn.innerHTML;btn.textContent=label;btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed==='1'){btn.dataset.armed='';btn.innerHTML=btn.dataset.orig;btn.classList.remove('armed');}},4500);
  return false;
}

/* ───────── olaylar ───────── */
async function quickPay(id,n){
  const d=DMAP.get(id);if(!d)return;
  const o=occ(d,n);
  if(o.rest<=0||o.est){openSheet('occ',{id,n});return;}
  const p={id:newId('o'),debtId:id,n,date:TODAY,amount:o.rest,method:lastMethod(),note:'',createdAt:Date.now(),sample:d.sample};
  try{await Store.putPay(p);toast(`${d.name} · ${fmt(o.rest)} ₺ ödendi (${METHODS[p.method]})`,'Geri al',()=>Store.delPay(p.id));}
  catch(e){toast(errText(e));}
}
function installApp(){
  if(INSTALL){const ev=INSTALL;INSTALL=null;ev.prompt();ev.userChoice.then(c=>{if(c&&c.outcome==='accepted')LS.set('hideInstall',true);render();}).catch(()=>{});return;}
  openText('Uygulama olarak kur','Chrome\'da adımlar:',"1. Sağ üstteki üç noktaya (⋮) dokun.\n2. \"Uygulamayı yükle\" ya da \"Ana ekrana ekle\" seçeneğine dokun.\n3. \"Yükle\" de.\n\nSimge ana ekranına gelir. Bundan sonra uygulamayı o simgeden aç.");
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action],.tab[data-tab]');if(!t)return;
  if(t.matches('.tab[data-tab]')&&!t.dataset.action){goTab(t.dataset.tab);return;}
  const a=t.dataset.action,id=t.dataset.id,n=t.dataset.n!=null?parseInt(t.dataset.n,10):null;
  switch(a){
    case 'tab':goTab(t.dataset.tab);break;
    case 'add':openSheet('debt',{kind:t.dataset.kind});break;
    case 'settings':openSheet('settings',{});break;
    case 'cash':openSheet('cash',{});break;
    case 'go':{const el=document.getElementById(t.dataset.to);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'book':S.book=t.dataset.v;LS.set('book',S.book);S.sel=null;render();break;
    case 'open-month':S.month=t.dataset.ym;S.day=null;S.filter='all';if(SHEET)closeSheet();goTab('takvim');break;
    case 'month':S.month=ymAdd(S.month,+t.dataset.k);S.day=null;render();break;
    case 'month-today':S.month=ymOf(TODAY);S.day=null;render();break;
    case 'filter':S.filter=t.dataset.v;render();break;
    case 'day':S.day=S.day===t.dataset.d?null:t.dataset.d;render();break;
    case 'day-clear':S.day=null;render();break;
    case 'occ':openSheet('occ',{id,n});break;
    case 'quick':quickPay(id,n);break;
    case 'detail':S.detail=id;S.dtab='plan';S.planAll=false;if(SHEET)closeSheet();goTab('borclar',true);break;
    case 'plan-all':S.planAll=!S.planAll;render();break;
    case 'back':S.detail=null;render();window.scrollTo(0,0);break;
    case 'dtab':S.dtab=t.dataset.v;render();break;
    case 'edit':if(SHEET)closeSheet();openSheet('debt',{id,focus:t.dataset.focus});break;
    case 'close-debt':if(SHEET)closeSheet();openSheet('close',{id});break;
    case 'reopen-debt':debtUpdate(id,d=>{d.closedAt=null;},'Borç yeniden açıldı');break;
    case 'end-debt':if(armed(t,'Bu aydan sonra bitecek · onayla'))debtUpdate(id,d=>{d.end=lastDayOf(ymOf(TODAY));},'Bu aydan sonra listede görünmeyecek');break;
    case 'restart-debt':debtUpdate(id,d=>{d.end=null;},'Bitiş kaldırıldı');break;
    case 'del-debt':if(armed(t,'Ödemeleriyle silinecek · onayla')){const d=DMAP.get(id);Store.delDebt(id).then(()=>{S.detail=null;render();toast('Silindi: '+(d?d.name:''));},err=>toast(errText(err)));}break;
    case 'sheet-close':closeSheet();break;
    case 'stmt-only':savePay(true);break;
    case 'pay-del':if(armed(t,'Emin misin?'))Store.delPay(t.dataset.pid).then(()=>toast('Ödeme silindi'),err=>toast(errText(err)));break;
    case 'chart-sel':S.sel=+t.dataset.i;drawChart();break;
    case 'journal-all':S.journalAll=!S.journalAll;render();break;
    case 'del-samples':if(armed(t,'Örnekler silinecek · onayla'))deleteSamples();break;
    case 'del-all':if(armed(t,'Her şey silinecek · onayla'))deleteAll();break;
    case 'share-month':shareText(monthText(t.dataset.ym||S.month),'Ödeme listesi');break;
    case 'exp-month':shareFile(`borc-cizelgesi-${S.month}.csv`,monthCSV(S.month),'text/csv').then(r=>{if(r==='downloaded')toast('Dosya İndirilenler klasörüne kaydedildi');});break;
    case 'exp-pays':shareFile(`odeme-defteri-${TODAY}.csv`,paysCSV(),'text/csv').then(r=>{if(r==='downloaded')toast('Dosya İndirilenler klasörüne kaydedildi');});break;
    case 'backup':doBackup();break;
    case 'imp-go':runImport();break;
    case 'imp-cancel':IMPORT=null;refreshSheet();break;
    case 'closed':{const w=+t.dataset.w,c=new Set(S.settings.closed||[]);if(c.has(w))c.delete(w);else c.add(w);Store.putSettings({closed:[...c].sort()}).catch(err=>toast(errText(err)));break;}
    case 'theme':Store.putSettings({theme:t.dataset.v}).catch(err=>toast(errText(err)));break;
    case 'remind-on':enableReminders();break;
    case 'remind-off':disableReminders();break;
    case 'install':installApp();break;
    case 'hide-install':LS.set('hideInstall',true);render();break;
    case 'select-text':{const ta=$('#t-text');if(ta){ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(err){}}break;}
    case 'toast-act':{const fn=toastFn;toastFn=null;$('#toast').hidden=true;if(fn)Promise.resolve().then(fn).then(()=>toast('Geri alındı'),err=>toast(errText(err)));break;}
  }
});
document.addEventListener('submit',e=>{
  const id=e.target.id;
  if(id==='pay-form'){e.preventDefault();savePay(false);}
  else if(id==='ov-form'){e.preventDefault();saveOverride();}
  else if(id==='close-form'){e.preventDefault();saveClose();}
  else if(id==='ciro-form'){e.preventDefault();const raw=$('#s-ciro').value.trim(),v=raw?parseTL(raw):null;if(raw&&!(v>0)){toast('Ciroyu rakamla yaz; ör. 250.000');return;}Store.putSettings({ciro:v}).then(()=>toast(v?'Ciro kaydedildi':'Ciro silindi'),err=>toast(errText(err)));}
});
document.addEventListener('change',e=>{if(e.target.id==='imp-file'&&e.target.files&&e.target.files[0])readImport(e.target.files[0]);});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='c-cash'||t.id==='c-daily')updateCash();
  if(t.id==='p-amount')t.dataset.touched='1';
  if(t.id==='p-stmt'){const pa=$('#p-amount');if(pa&&!pa.dataset.touched&&SHEET){const d=DMAP.get(SHEET.params.id);const v=parseTL(t.value);if(d&&Number.isFinite(v)){const o=occ(d,SHEET.params.n);pa.value=fmt(Math.max(0,v-o.paid));}}}
});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('amt-in')&&!t.readOnly&&t.value.trim()){const k=parseTL(t.value);if(Number.isFinite(k)&&k>=0)t.value=fmt(k);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&SHEET){closeSheet();return;}
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset&&t.dataset.action&&t.tagName!=='BUTTON'){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('toggle',e=>{const k=e.target&&e.target.dataset&&e.target.dataset.k;if(k)S[k]=e.target.open;},true);
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab==='analiz')drawChart();},150);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&localToday()!==TODAY){render();pushReminders();}});
window.addEventListener('storage',e=>{if(e.key===DATA_KEY){const d=loadData();if(d){DATA=d;hydrate();onData();}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(S.tab==='bugun')render();});
window.addEventListener('appinstalled',()=>{INSTALL=null;LS.set('hideInstall',true);toast('Uygulama telefonuna kuruldu');render();});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme());}catch(e){}

/* ───────── açılış ───────── */
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',ICON[el.dataset.icon]));
DATA=loadData();
if(!DATA){
  const s=sampleData();
  DATA={v:2,debts:s.debts,payments:s.pays,settings:{closed:[3]},meta:{created:Date.now()}};
  persist();
}
DATA.debts=DATA.debts||{};DATA.payments=DATA.payments||{};DATA.meta=DATA.meta||{};
hydrate();
const qs=new URLSearchParams(location.search);
const qTab=qs.get('sekme');
S.tab=['bugun','takvim','borclar','analiz'].includes(qTab)?qTab:(['bugun','takvim','borclar','analiz'].includes(LS.get('tab','bugun'))?LS.get('tab','bugun'):'bugun');
S.book=['all','isletme','kisisel'].includes(LS.get('book','all'))?LS.get('book','all'):'all';
render();
if(qs.get('yeni'))openSheet('debt',{});
else if(qs.get('hesap'))openSheet('cash',{});
if(qs.toString()){try{history.replaceState(null,'',location.pathname);}catch(e){}}
pushReminders();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(()=>{if(S.settings.remind&&!S.settings.remindBg)registerPeriodic().then(ok=>{if(ok)Store.putSettings({remindBg:true}).catch(()=>{});});}).catch(()=>{});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{});});}catch(e){}
})();
</script>
