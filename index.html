<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Borç Çizelgesi</title>
<meta name="description" content="Aylık borç ve ödeme çizelgesi: krediler, kart, kira, SGK, çek ve senetler tek yerde.">
<meta name="theme-color" content="#F3F4F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Borçlar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>
:root{
  /* Layout: lacivert kokpit kartı + serin kâğıt zemin üstünde liste kartları; altta sekme çubuğu ve safran ekle düğmesi; her işlem alttan açılan sayfada. */
  --bg:#F3F4F8; --surface:#FFFFFF; --chip:#EDEFF5; --line:#E1E4ED; --line-2:#C7CCDB;
  --ink:#141A33; --ink-2:#474E6B; --ink-3:#61688A;
  --navy:#18214A; --navy-2:#24305F; --on-navy:#F4F5FB; --on-navy-2:#B4BBDB; --navy-track:#36427A;
  --saffron:#F0A92B; --saffron-ink:#8A5A00; --on-saffron:#18214A;
  --primary:#18214A; --on-primary:#FFFFFF;
  --ok:#187049; --ok-soft:#E1F3EA;
  --late:#C0342B; --late-soft:#FCE5E2; --late-on-navy:#FF9F93;
  --soon:#9A5B00; --soon-soft:#FDF0D9;
  --info:#2C55C7; --info-soft:#E4EBFC;
  --bar:#4F5FB0; --bar-sel:#C98200;
  --heat1:#E9ECF6; --heat2:#D5DBF0; --heat3:#B8C2E6;
  --scrim:rgba(14,18,34,.5);
  --shadow:0 1px 2px rgba(20,26,51,.06),0 12px 30px -16px rgba(20,26,51,.42);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1120; --surface:#161B2F; --chip:#1F2541; --line:#272E4A; --line-2:#3A4366;
    --ink:#E9EBF5; --ink-2:#B6BCD6; --ink-3:#8D94B3;
    --navy:#1F2B60; --navy-2:#2A3876; --on-navy:#F4F5FB; --on-navy-2:#BAC1E3; --navy-track:#3B4888;
    --saffron:#F2B23E; --saffron-ink:#F2B23E; --on-saffron:#141A33;
    --primary:#F2B23E; --on-primary:#141A33;
    --ok:#4CC38A; --ok-soft:#12301F;
    --late:#F07A6E; --late-soft:#3A1A18; --late-on-navy:#FFA59A;
    --soon:#E9A83A; --soon-soft:#33270F;
    --info:#8DA8F5; --info-soft:#1A2547;
    --bar:#6B79C4; --bar-sel:#C28819;
    --heat1:#1C2340; --heat2:#25305C; --heat3:#34427F;
    --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 38px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2F; --chip:#1F2541; --line:#272E4A; --line-2:#3A4366;
  --ink:#E9EBF5; --ink-2:#B6BCD6; --ink-3:#8D94B3;
  --navy:#1F2B60; --navy-2:#2A3876; --on-navy:#F4F5FB; --on-navy-2:#BAC1E3; --navy-track:#3B4888;
  --saffron:#F2B23E; --saffron-ink:#F2B23E; --on-saffron:#141A33;
  --primary:#F2B23E; --on-primary:#141A33;
  --ok:#4CC38A; --ok-soft:#12301F;
  --late:#F07A6E; --late-soft:#3A1A18; --late-on-navy:#FFA59A;
  --soon:#E9A83A; --soon-soft:#33270F;
  --info:#8DA8F5; --info-soft:#1A2547;
  --bar:#6B79C4; --bar-sel:#C28819;
  --heat1:#1C2340; --heat2:#25305C; --heat3:#34427F;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 38px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{text-wrap:balance}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.quiet{font-size:14px;color:var(--ink-3)}
.sub{font-size:14px;color:var(--ink-2)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.link{appearance:none;background:none;border:0;padding:6px 0;color:var(--info);font-weight:700;font-size:14px;line-height:1.3;cursor:pointer;text-align:left}
.neg{color:var(--late);font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand-mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.brand-mark svg{width:24px;height:24px}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.brand-date{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.icon-btn svg{width:21px;height:21px}

/* page */
.main{max-width:640px;margin:0 auto;padding-top:4px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.vhead{display:flex;flex-direction:column;gap:4px}
.vtitle{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:72px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--f-display);font-weight:750;font-size:19px;letter-spacing:-.01em}
.sec-h .v{font-size:14.5px;font-weight:750;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec.late .sec-h h2,.sec.late .sec-h .v{color:var(--late)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{font-family:var(--f-display);font-weight:750;font-size:17px}

/* banners */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;border-radius:14px;background:var(--info-soft);font-size:13.5px;line-height:1.45}
.banner > .bt{flex:1 1 200px;min-width:0}
.banner.warn{background:var(--soon-soft)}
.banner.bad{background:var(--late-soft)}
.banner .bi{flex:none}
.banner .btn{min-height:38px;padding:0 14px;font-size:13.5px}
.banner.has-x{position:relative;padding-right:46px}
.banner .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;border-radius:10px;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer}

/* cockpit */
.ck{background:var(--navy);color:var(--on-navy);border-radius:22px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ck-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ck-lbl{font-size:13.5px;font-weight:650;color:var(--on-navy-2)}
.ck-pct{font-size:12.5px;font-weight:800;color:var(--saffron);white-space:nowrap}
.ck-fig{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12.6vw,56px);line-height:1;letter-spacing:-.025em;color:var(--on-navy);overflow-wrap:anywhere}
.ck-fig .dec{font-size:.5em;letter-spacing:0;color:var(--on-navy-2);font-weight:600}
.ck-fig .cur{font-size:.44em;margin-left:.22em;color:var(--saffron);font-weight:750}
.ck-bar{height:8px;border-radius:999px;background:var(--navy-track);overflow:hidden}
.ck-bar span{display:block;height:100%;background:var(--saffron);border-radius:999px}
.ck-sub{font-size:13px;color:var(--on-navy-2)}
.ck-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:4px -4px 0;border-top:1px solid var(--navy-track)}
.ck-st{appearance:none;background:none;border:0;color:inherit;text-align:left;padding:12px 4px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;border-radius:10px}
.ck-st + .ck-st{border-left:1px solid var(--navy-track);padding-left:12px}
.ck-st span{font-size:12px;color:var(--on-navy-2);font-weight:650}
.ck-st b{font-size:clamp(15px,4.4vw,18px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-st.bad b{color:var(--late-on-navy)}
.ck-note{font-size:13px;color:var(--on-navy-2)}
.ck-cta{align-self:flex-start;appearance:none;display:inline-flex;align-items:center;gap:6px;background:var(--navy-2);border:0;color:var(--saffron);font-weight:750;font-size:14px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer}
.ck :focus-visible{outline-color:var(--saffron)}

/* brief */
.brief{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.brief li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;padding:12px 14px;align-items:start}
.brief li + li{border-top:1px solid var(--line)}
.bi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--ink-2)}
.bi svg{width:17px;height:17px}
.t-late .bi{background:var(--late-soft);color:var(--late)}
.t-soon .bi{background:var(--soon-soft);color:var(--soon)}
.t-info .bi{background:var(--info-soft);color:var(--info)}
.t-ok .bi{background:var(--ok-soft);color:var(--ok)}
.bt{font-size:14.5px;line-height:1.45;min-width:0}
.bt .link{padding:2px 0;margin-left:4px;font-size:14px}

/* list rows */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"tile name amt" "tile meta act";column-gap:12px;row-gap:5px;padding:12px 14px;align-items:center}
.list > .row + .row{border-top:1px solid var(--line)}
.row-hit{position:absolute;inset:0;z-index:1;width:100%;background:none;border:0;padding:0;margin:0;cursor:pointer}
.row-hit:focus-visible{outline-offset:-3px}
.row > :not(.row-hit){position:relative;z-index:2;pointer-events:none}
.row .act{pointer-events:auto}
.tile{grid-area:tile;align-self:start;width:46px;height:50px;border-radius:13px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1}
.tile b{font-family:var(--f-display);font-weight:750;font-size:20px}
.tile i{font-style:normal;font-size:10.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tile.today{background:var(--navy);color:var(--on-navy)}
.tile.today i{color:var(--saffron)}
.is-late .tile{background:var(--late-soft);color:var(--late)}
.is-late .tile i{color:var(--late)}
.row-name{grid-area:name;font-weight:750;font-size:15px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.row-meta{grid-area:meta;font-size:12.5px;color:var(--ink-3);line-height:1.4;min-width:0}
.row-meta .st{font-weight:750}
.row-amt{grid-area:amt;text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-act{grid-area:act;justify-self:end;align-self:center}
.done .row-amt{color:var(--ink-3);font-weight:650}
.s-late{color:var(--late)} .s-soon{color:var(--soon)} .s-ok{color:var(--ok)} .s-info{color:var(--info)} .s-mute{color:var(--ink-3)}
.act{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 16px;border-radius:999px;border:0;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap}
.act.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.okmark{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:750;color:var(--ok);white-space:nowrap}
.okmark.mute{color:var(--ink-3)}
.okmark svg{width:15px;height:15px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;border:1px dashed var(--line-2);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.6;color:var(--ink-3);vertical-align:2px}
.badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--ink-2);font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.5;vertical-align:2px;white-space:nowrap}
.badge.b-kritik{background:var(--late-soft);color:var(--late)}
.badge.b-esnek{background:var(--ok-soft);color:var(--ok)}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px}
.foot .eyebrow{font-size:11px}
.foot b{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:3px double var(--ink);padding-bottom:1px}
.more{display:flex;flex-direction:column;gap:10px}
.more > summary,.more-f > summary{cursor:pointer;font-weight:750;font-size:14.5px;color:var(--ink-2);padding:6px 2px;list-style-position:inside}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:750;font-size:15px;line-height:1.15;cursor:pointer;text-align:center}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn.armed,.mini.armed{background:var(--late);border-color:var(--late);color:#fff}
.mini{min-height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:750;cursor:pointer}
.mini.danger{color:var(--late)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* seg */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;background:var(--chip);border-radius:13px}
.seg label{position:relative;display:block;min-width:0}
.seg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.seg span,.seg button{display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px;padding:4px 6px;border-radius:10px;font-weight:700;font-size:13.5px;line-height:1.15;color:var(--ink-2)}
.seg button{width:100%;appearance:none;border:0;background:none;cursor:pointer}
.seg input:checked + span,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,51,.14)}
.seg input:focus-visible + span{outline:2px solid var(--info);outline-offset:1px}
.seg input:disabled + span{opacity:.4}
.seg.sm span,.seg.sm button{min-height:34px;font-size:12.5px}
.bookseg{max-width:360px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}

/* calendar */
.monthbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.nav-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.nav-btn svg{width:20px;height:20px}
.mb-title{text-align:center;display:flex;flex-direction:column;gap:1px}
.mb-title h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.mb-title span{font-size:13px;color:var(--ink-3)}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.kv3 > div{min-width:0}
.kv3 dt{font-size:12px;font-weight:700;color:var(--ink-3)}
.kv3 dd{margin:2px 0 0;font-weight:800;font-size:clamp(14px,4vw,16px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pbar{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.pbar span{display:block;height:100%;border-radius:999px;background:var(--navy)}
:root[data-theme="dark"] .pbar span{background:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pbar span{background:var(--saffron)}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;font-weight:800;text-align:center;color:var(--ink-3);padding:2px 0 4px;letter-spacing:.03em}
.cal-h.off{opacity:.5}
.cd{position:relative;min-height:54px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 1px 5px;gap:3px;background:transparent;border:0;color:var(--ink);min-width:0}
button.cd{cursor:pointer}
.cd-n{font-size:14px;font-weight:700;line-height:1.1}
.cd-a{font-size:10.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.cd.off .cd-n{color:var(--ink-3)}
.cd.h1{background:var(--heat1)} .cd.h2{background:var(--heat2)} .cd.h3{background:var(--heat3)}
.cd.today{box-shadow:inset 0 0 0 2px var(--saffron)}
.cd.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.mk{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;display:inline-block}
.mk.late{background:var(--late)} .mk.open{background:var(--info)} .mk.done{background:var(--ok)}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);align-items:center}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend .mk{position:static}
.wk{list-style:none;margin:0;padding:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.wk li{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.wk li + li{border-top:1px solid var(--line)}
.wk-l{font-weight:700;white-space:nowrap}
.wk-l i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3)}
.wk-t{height:8px;border-radius:0 4px 4px 0;background:transparent;display:block}
.wk-t span{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.wk li.max .wk-t span{background:var(--bar-sel)}
.wk-v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* debts */
.sumcard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--navy);color:var(--on-navy);border-radius:18px;padding:14px 16px}
.sumcard > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.sumcard span{font-size:12px;font-weight:650;color:var(--on-navy-2)}
.sumcard b{font-size:clamp(14.5px,4.2vw,17px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.accs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.accs li + li{border-top:1px solid var(--line)}
.acc{width:100%;appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.acc-name{font-weight:750;font-size:15.5px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.acc-amt{font-weight:800;font-size:15.5px;text-align:right;white-space:nowrap}
.acc-meta{font-size:12.5px;color:var(--ink-3);min-width:0}
.acc-sub{font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:right;white-space:nowrap}
.acc .pbar{grid-column:1/-1;height:6px;margin-top:6px}
.acc-next{grid-column:1/-1;font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.acc-next .st{font-weight:750}

/* detail */
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:-8px}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;background:none;border:0;color:var(--info);font-weight:750;font-size:15px;cursor:pointer;padding:0}
.back svg{width:20px;height:20px}
.dt-head{display:flex;flex-direction:column;gap:6px}
.dt-name{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.prio-line{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prio-line .badge{margin-left:0}
.nextbox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:var(--chip)}
.nextbox.late{background:var(--late-soft)}
.nextbox > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.nextbox b{font-size:14.5px}
.nextbox .tnum{font-weight:800;font-size:16px}
.kvl{margin:0;display:flex;flex-direction:column}
.kvl > div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;align-items:baseline}
.kvl > div + div{border-top:1px solid var(--line)}
.kvl dt{font-size:13.5px;color:var(--ink-2)}
.kvl dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.payoff{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--info-soft)}
.payoff p{font-size:14px}
.payoff .btn{align-self:flex-start;min-height:40px}
.tipbox{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line-2);font-size:13.5px;color:var(--ink-2)}
.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.plan li + li{border-top:1px solid var(--line)}
.prow{width:100%;appearance:none;display:grid;grid-template-columns:minmax(2.1em,auto) minmax(0,1fr) auto 6.4em;gap:10px;align-items:center;padding:11px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;font-size:13.5px}
.prow .pn{color:var(--ink-3);font-weight:700;white-space:nowrap}
.prow .pd i{font-style:normal;color:var(--ink-3);font-size:12px}
.prow .pa{font-weight:750;text-align:right;white-space:nowrap}
.prow .ps{text-align:right;font-weight:750;font-size:12.5px}
.prow.done .pa{color:var(--ink-3);font-weight:600}
.prow.is-late .pa{color:var(--late)}
.ledger{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.lg{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d a" "t b";gap:2px 12px;padding:10px 14px}
.lg + .lg{border-top:1px solid var(--line)}
.lg-d{grid-area:d;font-size:12px;color:var(--ink-3)}
.lg-t{grid-area:t;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.lg-a{grid-area:a;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.lg-a.cr{color:var(--ok)}
.lg-b{grid-area:b;text-align:right;font-size:12px;color:var(--ink-3);white-space:nowrap}
.lg.adj .lg-t{font-style:italic;color:var(--ink-2)}
.ltot{margin:0;display:flex;flex-direction:column;padding:0 4px}
.ltot > div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;align-items:baseline}
.ltot dt{font-size:13.5px;color:var(--ink-2)}
.ltot dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700}
.ltot .grand{border-top:1px solid var(--ink);margin-top:4px;padding-top:8px}
.ltot .grand dt{font-weight:800;color:var(--ink)}
.ltot .grand dd{font-weight:800;font-size:15.5px;border-bottom:3px double var(--ink);padding-bottom:1px}

/* analysis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi span{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.kpi b{font-family:var(--f-display);font-weight:750;font-size:clamp(20px,6vw,25px);letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:12px;color:var(--ink-3);line-height:1.35}
.kpi.dark{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.kpi.dark span,.kpi.dark i{color:var(--on-navy-2)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px;display:flex;flex-direction:column;gap:8px}
.chart-host{width:100%;min-height:206px}
.chart-host svg{display:block;max-width:100%;height:auto;overflow:visible}
.g{stroke:var(--line);stroke-width:1}
.ax{fill:var(--ink-3);font-family:var(--f-body);font-size:10.5px;font-variant-numeric:tabular-nums}
.ax.yr{fill:var(--ink-2);font-weight:700}
.vlab{fill:var(--ink);font-family:var(--f-body);font-size:11px;font-weight:800}
.cb{fill:var(--bar)}
.cb.sel{fill:var(--bar-sel)}
.hit{fill:transparent;cursor:pointer;outline:none}
.hit:focus-visible{stroke:var(--info);stroke-width:1.5}
.chart-info{display:flex;flex-direction:column;gap:3px;padding:8px 6px 2px;border-top:1px solid var(--line);font-size:13.5px}
.chart-info .ci-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart-info b{font-size:14.5px}
.chart-info .ci-mix{color:var(--ink-2)}
.tview summary{cursor:pointer;color:var(--info);font-weight:750;font-size:13.5px;padding:6px 6px}
.tv-wrap{overflow-x:auto}
table.tv{width:100%;border-collapse:collapse;font-size:13px}
.tv th{text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.tv td,.tv th{padding:7px 6px;border-top:1px solid var(--line);white-space:nowrap}
.tv .r{text-align:right;font-variant-numeric:tabular-nums}
.relief{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.relief li + li{border-top:1px solid var(--line)}
.rl{width:100%;appearance:none;display:grid;grid-template-columns:4.4em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.rl-m{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.1}
.rl-m i{display:block;font-style:normal;font-family:var(--f-body);font-size:11.5px;font-weight:700;color:var(--ink-3)}
.rl-b{font-size:14px;min-width:0}
.rl-b .hint{display:block}
.rl-v{text-align:right;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap}
.rl-v i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3)}
.rl.free .rl-v{color:var(--ink)}
.pgs{display:flex;flex-direction:column;gap:12px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 2px}
.pg-h b{font-size:15px}
.pg-h span{font-weight:800;font-variant-numeric:tabular-nums}
.pg > .hint{padding:0 14px 8px}
.ml{list-style:none;margin:0;padding:0}
.ml li{border-top:1px solid var(--line)}
.ml button{width:100%;appearance:none;display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:10px;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;font-size:13.5px;align-items:baseline}
.ml .d{color:var(--ink-3);font-weight:700;font-size:12.5px}
.ml .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ml .late .d{color:var(--late)}
.costs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.costs li + li{border-top:1px solid var(--line)}
.cost-r{width:100%;appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.cost-r b{font-size:15px}
.cost-r .r{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cost-r .hint{grid-column:1/-1}
.hbars{list-style:none;margin:0;padding:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;align-items:baseline}
.hb + .hb{border-top:1px solid var(--line)}
.hb-l{font-size:14px;min-width:0}
.hb-v{font-size:13.5px;text-align:right;white-space:nowrap;font-weight:750;font-variant-numeric:tabular-nums}
.hb-v i{font-style:normal;color:var(--ink-3);margin-left:6px;font-size:12px;font-weight:600}
.hb-track{grid-column:1/-1;height:8px;display:block}
.hb-fill{display:block;height:8px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.jm{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.jm-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;background:var(--chip)}
.jm-h b{font-size:14.5px}
.jm-h span{font-weight:800;font-variant-numeric:tabular-nums}
.jm-mix{padding:6px 14px 0;font-size:12px;color:var(--ink-3)}
.jl{list-style:none;margin:0;padding:0 14px 4px}
.jl li{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:10px;padding:9px 0;font-size:13.5px;align-items:baseline}
.jl li + li{border-top:1px solid var(--line)}
.jl .d{color:var(--ink-3);font-weight:700;font-size:12.5px}
.jl .t{min-width:0;overflow-wrap:anywhere}
.jl .t i{display:block;font-style:normal;color:var(--ink-3);font-size:12px}
.jl .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.jl .cash .t i{color:var(--soon);font-weight:700}
.exp{display:flex;flex-direction:column;gap:8px}
.exp .btn{justify-content:flex-start}

/* empty */
.empty{display:flex;flex-direction:column;gap:16px}
.start{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.start-t{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:inherit;min-width:0}
.start-t svg{width:26px;height:26px;color:var(--saffron-ink)}
.start-t b{font-size:15px;line-height:1.25}
.start-t i{font-style:normal;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.whys{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:14px}
.skel{display:flex;flex-direction:column;gap:10px}
.skel span{display:block;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:66px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tab{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:11.5px;font-weight:750;min-width:0}
.tab svg{width:44px;height:28px;padding:2px 10px;border-radius:999px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{background:var(--chip)}
.fab{justify-self:center;align-self:center;width:58px;height:58px;border-radius:19px;background:var(--saffron);color:var(--on-saffron);border:0;display:grid;place-items:center;box-shadow:var(--shadow);transform:translateY(-14px);cursor:pointer}
.fab svg{width:27px;height:27px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.panel{position:relative;width:100%;max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:calc(100% - 14px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.panel-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;min-height:58px;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel-bar .t{font-family:var(--f-display);font-weight:800;font-size:17px;text-align:center;letter-spacing:-.01em}
.panel-bar .l{justify-self:start}
.panel-bar .r{justify-self:end}
.bar-btn{min-height:44px;padding:0 2px;background:none;border:0;font-weight:800;font-size:15px;color:var(--info);cursor:pointer}
.bar-btn.muted{color:var(--ink-2);font-weight:650}
.panel-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:18px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
@keyframes rise{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;flex-direction:column;gap:5px}
.sh-name{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.08;letter-spacing:-.015em;overflow-wrap:anywhere}
.st-line{font-weight:750;font-size:13.5px}
.note{padding:12px 14px;border-radius:12px;background:var(--chip);font-size:14px;color:var(--ink-2)}
.paylist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px}
.paylist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 8px 8px 12px;font-size:13.5px}
.paylist li + li{border-top:1px solid var(--line)}
.set{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0;padding-bottom:0}
.set p{font-size:14px;color:var(--ink-2)}
.set .btn{justify-content:flex-start}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dayt{appearance:none;min-height:42px;border-radius:12px;border:1px solid var(--line-2);background:transparent;font-weight:750;font-size:13px;cursor:pointer;color:var(--ink-2)}
.dayt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.verdict{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px}
.verdict b{font-family:var(--f-display);font-weight:800;font-size:22px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--late-soft);color:var(--late)}
.verdict span{color:var(--ink);font-size:14.5px}
.cash-rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px}
.cash-rows li{display:grid;grid-template-columns:4.8em minmax(0,1fr) auto 5.6em;gap:8px;padding:9px 12px;font-size:13px;align-items:baseline}
.cash-rows li + li{border-top:1px solid var(--line)}
.cash-rows .h{font-size:11.5px;font-weight:800;color:var(--ink-3);background:var(--chip);border-radius:12px 12px 0 0}
.cash-rows .d{color:var(--ink-3);font-weight:700}
.cash-rows .n{min-width:0;overflow-wrap:anywhere}
.cash-rows .a,.cash-rows .b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cash-rows .b{font-weight:800}
.cash-rows li.short .b{color:var(--late)}
.cash-rows li.lt .d{color:var(--late)}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.fs{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.fs legend{padding:0;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:13px;font-weight:750;color:var(--ink-2)}
.opt{font-weight:500;color:var(--ink-3)}
.in{width:100%;min-height:50px;padding:11px 13px;border-radius:13px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.25}
.in:focus{outline:2px solid var(--info);outline-offset:0;border-color:var(--info)}
.amt-in,.num-in{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.in[readonly]{color:var(--ink-3)}
.in[aria-invalid="true"]{border-color:var(--late)}
input[type="date"].in{text-align:left;-webkit-appearance:none;appearance:none}
textarea.in{resize:vertical;min-height:64px}
select.in{appearance:auto}
.err{color:var(--late);font-size:13px;font-weight:650}
.err:empty{display:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--navy);margin:1px 0 0;flex:none}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.type{position:relative;display:block;min-width:0}
.type input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.type-in{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);height:100%}
.type-in svg{width:22px;height:22px;color:var(--ink-3)}
.type-in b{font-size:14px;line-height:1.25}
.type-in i{font-style:normal;font-size:12px;line-height:1.35;color:var(--ink-3)}
.type input:checked + .type-in{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.type input:checked + .type-in svg{color:var(--saffron-ink)}
.type input:focus-visible + .type-in{outline:2px solid var(--info);outline-offset:2px}
.type input:disabled + .type-in{opacity:.4}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.picks .lab{margin-right:4px}
.pick{appearance:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:13.5px;font-weight:650;color:var(--ink-2);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.preview{padding:12px 14px;border-radius:13px;background:var(--chip);font-size:14px;line-height:1.6;color:var(--ink-2)}
.preview b{color:var(--ink);font-weight:800}
.more-f{border:1px solid var(--line);border-radius:14px;padding:4px 12px}

.more-in{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.inline{display:flex;gap:8px}
.inline .in{flex:1;min-width:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:4px;width:max-content;max-width:min(560px,calc(100% - 32px));padding:6px 6px 6px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:14px;line-height:1.35;animation:fade .2s ease-out}
.toast .msg{flex:1;min-width:0;padding:7px 0}
.toast button{flex:none;min-height:38px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.toast{animation:none}}

(function(){
'use strict';

/* ───────── simgeler ───────── */

/* ───────── sabitler ───────── */
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const AYLAR_DA=["Ocak'ta","Şubat'ta","Mart'ta","Nisan'da","Mayıs'ta","Haziran'da","Temmuz'da","Ağustos'ta","Eylül'de","Ekim'de","Kasım'da","Aralık'ta"];
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GUNK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const GUNK_MON=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const KINDS={

};

  banka:{label:'Kredi',prio:'onemli'},
  kart:{label:'Kredi kartı',prio:'onemli'},
  kira:{label:'Kira',prio:'onemli'},
  sgk:{label:'SGK / Bağ-Kur',prio:'kritik'},
  vergi:{label:'Vergi',prio:'kritik'},
  personel:{label:'Maaş',prio:'kritik'},
  fatura:{label:'Fatura',prio:'onemli'},
  tedarik:{label:'Tedarikçi / depo',prio:'onemli'},
  cek:{label:'Çek',prio:'kritik'},

  diger:{label:'Diğer',prio:'onemli'}
};
const PRIOS={
  kritik:{label:'Ertelenemez',hint:'Gecikmesi ceza, gecikme zammı ya da yasal sorun doğurabilir.'},
  onemli:{label:'Önemli',hint:'Gecikirse faiz işler; banka borçlarında kredi notunu düşürebilir.'},
  esnek:{label:'Esnek',hint:'Karşı tarafla konuşup erteleyebileceğin ödemeler.'}
};
const PICKS={
  taksit:[['İşletme kredisi','banka'],['Taşıt kredisi','banka'],['İhtiyaç kredisi','banka'],['Taksitli alım','diger']],
  kart:[['Kredi kartı','kart'],['Ticari kart','kart']],
  sabit:[['Kira','kira'],['SGK primi','sgk'],['Bağ-Kur','sgk'],['Maaş','personel'],['Elektrik','fatura'],['Su','fatura'],['İnternet','fatura'],['Muhasebeci','diger'],['KDV','vergi']],
  tek:[['Çek','cek'],['Senet','senet'],['Depo borcu','tedarik'],['Elden borç','elden'],['Vergi','vergi']]
};
const METHODS={banka:'Banka / POS',nakit:'Nakit',kart:'Kredi kartı'};
const BOOKS={isletme:'İşletme',kisisel:'Kişisel'};
const EVERY={1:'Her ay',2:'2 ayda bir',3:'3 ayda bir',6:'6 ayda bir',12:'Yılda bir'};
const ST_LABEL={odendi:'Ödendi',once:'Önceden ödendi',kapandi:'Kapandı',devretti:'Kısmi, kalanı devretti',tutar:'Tutar girilmedi',kismi:'Kısmi',gecikti:'Gecikti',yakin:'Yaklaşıyor',bekliyor:'Bekliyor'};
const RANK={gecikti:0,kismi:1,yakin:1,tutar:1,bekliyor:2,odendi:3,devretti:3,once:4,kapandi:4};

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ───────── tarih ───────── */
const pad2=n=>String(n).padStart(2,'0');
function localToday(){const t=new Date();return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());}
function P(s){return {y:+s.slice(0,4),m:+s.slice(5,7),d:+s.slice(8,10)};}
function ymd(y,m,d){return y+'-'+pad2(m)+'-'+pad2(d);}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
function addMonthsA(s,k,anchor){const p=P(s);let t=p.m-1+k;const y=p.y+Math.floor(t/12);t=((t%12)+12)%12;const m=t+1;return ymd(y,m,Math.min(anchor||p.d,dim(y,m)));}
const ymOf=s=>s.slice(0,7);
function ymAdd(ym,k){let y=+ym.slice(0,4),t=+ym.slice(5,7)-1+k;y+=Math.floor(t/12);t=((t%12)+12)%12;return y+'-'+pad2(t+1);}
function ymDiff(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));}
function utc(s){const p=P(s);return Date.UTC(p.y,p.m-1,p.d);}
function dayDiff(a,b){return Math.round((utc(b)-utc(a))/864e5);}
function addDays(s,k){const t=new Date(utc(s)+k*864e5);return ymd(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate());}
function wd(s){return new Date(utc(s)).getUTCDay();}
function dShort(s){const p=P(s);return p.d+' '+AYK[p.m-1];}
function dShortY(s){const p=P(s);return p.d+' '+AYK[p.m-1]+' '+p.y;}
function dLong(s){const p=P(s);return p.d+' '+AYLAR[p.m-1]+' '+p.y+', '+GUNLER[wd(s)];}
function dMed(s){const p=P(s);return p.d+' '+AYLAR[p.m-1]+(p.y!==+TODAY.slice(0,4)?' '+p.y:'')+' '+GUNLER[wd(s)];}
function dDot(s){const p=P(s);return pad2(p.d)+'.'+pad2(p.m)+'.'+p.y;}
function ymLabel(ym){return AYLAR[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
function ymShort(ym){return AYK[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
function lastDayOf(ym){return ym+'-'+pad2(dim(+ym.slice(0,4),+ym.slice(5,7)));}
function tsYmd(ts){const t=new Date(ts);return ymd(t.getFullYear(),t.getMonth()+1,t.getDate());}
function gunEki(d){const l=d%10;if(l===0)return d===20?"'si":"'u";return ({1:"'i",2:"'si",3:"'ü",4:"'ü",5:"'i",6:"'sı",7:"'si",8:"'i",9:"'u"})[l];}
function yearSfx(y){const s=String(y),l=+s.slice(-1),t=+s.slice(-2,-1);if(l)return ({1:'de',2:'de',3:'te',4:'te',5:'te',6:'da',7:'de',8:'de',9:'da'})[l];return ({0:'de',1:'da',2:'de',3:'da',4:'ta',5:'de',6:'ta',7:'te',8:'de',9:'da'})[t];}
function ymLoc(ym){const y=+ym.slice(0,4);return AYLAR[+ym.slice(5,7)-1]+' '+y+"'"+yearSfx(y);}
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function validDate(s){if(typeof s!=='string'||!DATE_RE.test(s))return false;const p=P(s);return p.y>=1990&&p.y<=2200&&p.m>=1&&p.m<=12&&p.d>=1&&p.d<=dim(p.y,p.m);}
function rangeLabel(s,e){const a=P(s),b=P(e);return a.d===b.d?a.d+' '+AYK[a.m-1]:a.d+'–'+b.d+' '+AYK[b.m-1];}

/* ───────── para (kuruş) ───────── */
const NF2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF1=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:1});
const NF0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const fmt=k=>NF2.format((k||0)/100);
const fmt0=k=>NF0.format(Math.round((k||0)/100));
function fmtC(k){const v=(k||0)/100,a=Math.abs(v);if(a>=1e6)return NF1.format(v/1e6)+' mn';if(a>=1e3)return NF1.format(v/1e3)+' bin';return NF0.format(v);}
function fmtK(k){const v=(k||0)/100;if(v<1000)return NF0.format(v);if(v<1e4)return NF1.format(v/1000)+'b';if(v<1e6)return NF0.format(v/1000)+'b';return NF1.format(v/1e6)+'m';}
function heroNum(k){const s=fmt(k),i=s.lastIndexOf(',');return esc(s.slice(0,i))+'<span class="dec">'+esc(s.slice(i))+'</span>';}
const pctTR=(r,dec)=>(r*100).toFixed(dec==null?1:dec).replace('.',',');
function parseTL(str){
  if(str==null)return NaN;
  let s=String(str).replace(/\s|₺/g,'').replace(/tl$/i,'');
  if(!s)return NaN;
  const hasDot=s.includes('.'),hasComma=s.includes(',');
  if(hasDot&&hasComma)s=s.replace(/\./g,'').replace(',','.');
  else if(hasComma)s=s.replace(',','.');
  else if(hasDot){const parts=s.split('.');if(parts.length>2||parts[parts.length-1].length===3)s=parts.join('');}
  if(!/^\d+(\.\d+)?$/.test(s))return NaN;
  return Math.round(parseFloat(s)*100);
}
const csvAmt=k=>((k||0)/100).toFixed(2).replace('.',',');

/* ───────── durum ───────── */
let TODAY=localToday();
const LS={
  get(k,def){try{const v=localStorage.getItem('borc-cizelgesi.ui.'+k);return v==null?def:JSON.parse(v);}catch(e){return def;}},
  set(k,v){try{localStorage.setItem('borc-cizelgesi.ui.'+k,JSON.stringify(v));}catch(e){}}
};
const S={tab:'bugun',month:ymOf(TODAY),day:null,filter:'all',book:'all',detail:null,dtab:'plan',
  debts:[],payments:[],settings:{ciro:null,closed:[3],remind:false,remindBg:false,theme:'system'},
  sel:null,openClosed:false,openTable:false,openPaid:false,journalAll:false,planAll:false};
let DMAP=new Map(),PIDX=new Map(),PBYD=new Map();
let SHEET=null,IMPORT=null,CHART=null,INSTALL=null,DATA=null;

/* ───────── kayıt temizliği ───────── */
const ID_RE=/^[A-Za-z0-9_\-.~:@+]{1,150}$/;
const validId=s=>typeof s==='string'&&ID_RE.test(s);
const intOr=(v,def)=>Number.isFinite(v)?Math.round(v):def;
function cleanDebt(id,x){
  if(!x||typeof x!=='object'||!KINDS[x.kind]||!validDate(x.first))return null;
  const kind=x.kind,cat=CATS[x.cat]?x.cat:KINDS[kind].defCat;
  const d={id,kind,cat,
    name:typeof x.name==='string'&&x.name.trim()?x.name.trim().slice(0,80):'Adsız borç',
    book:BOOKS[x.book]?x.book:'isletme',
    prio:PRIOS[x.prio]?x.prio:CATS[cat].prio,
    amount:Math.max(0,intOr(x.amount,0)),
    count:kind==='taksit'?Math.min(600,Math.max(1,intOr(x.count,1))):(kind==='tek'?1:null),
    first:x.first,
    every:kind==='sabit'&&[1,2,3,6,12].includes(x.every)?x.every:1,
    end:(kind==='sabit'||kind==='kart')&&validDate(x.end)?x.end:null,
    paidBefore:kind==='tek'?0:Math.max(0,intOr(x.paidBefore,0)),
    closedAt:(kind==='taksit'||kind==='tek')&&validDate(x.closedAt)?x.closedAt:null,
    principal:kind==='taksit'&&Number.isFinite(x.principal)&&x.principal>0?Math.round(x.principal):null,
    steps:kind==='sabit'&&Array.isArray(x.steps)?x.steps.filter(s=>s&&typeof s.from==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(s.from)&&Number.isFinite(s.amount)&&s.amount>=0).map(s=>({from:s.from,amount:Math.round(s.amount)})).sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0).slice(0,60):[],
    note:typeof x.note==='string'?x.note.slice(0,300):'',
    overrides:{},
    total:Number.isFinite(x.total)?Math.round(x.total):null,
    autoLast:Number.isFinite(x.autoLast)?Math.round(x.autoLast):null,
    sample:x.sample===true,
    createdAt:intOr(x.createdAt,0)};
  if(kind==='taksit'&&d.paidBefore>d.count)d.paidBefore=d.count;
  if(x.overrides&&typeof x.overrides==='object')for(const k in x.overrides){const n=parseInt(k,10),v=x.overrides[k];if(n>=1&&Number.isFinite(v)&&v>=0)d.overrides[n]=Math.round(v);}
  return d;
}
function cleanPay(id,x){
  if(!x||typeof x!=='object'||typeof x.debtId!=='string'||!x.debtId)return null;
  const n=intOr(x.n,-1),amount=intOr(x.amount,0);
  if(n<0||amount<=0||!validDate(x.date))return null;
  return {id,debtId:x.debtId,n,date:x.date,amount,method:METHODS[x.method]?x.method:'banka',
    note:typeof x.note==='string'?x.note.slice(0,200):'',createdAt:intOr(x.createdAt,0),sample:x.sample===true};
}
function cleanSettings(x){
  const o={ciro:null,closed:[3],remind:false,remindBg:false,theme:'system'};
  if(x&&typeof x==='object'){
    if(Number.isFinite(x.ciro)&&x.ciro>0)o.ciro=Math.round(x.ciro);
    if(Array.isArray(x.closed))o.closed=[...new Set(x.closed.filter(n=>Number.isInteger(n)&&n>=0&&n<=6))].sort();
    o.remind=x.remind===true;o.remindBg=x.remindBg===true;
    if(['system','light','dark'].includes(x.theme))o.theme=x.theme;
  }
  return o;
}
function debtDoc(d){
  const o={kind:d.kind,name:d.name,cat:d.cat,book:d.book,prio:d.prio,amount:d.amount,first:d.first,paidBefore:d.paidBefore||0,
    note:d.note||'',overrides:Object.assign({},d.overrides||{}),createdAt:d.createdAt||Date.now(),updatedAt:Date.now()};
  if(d.kind==='taksit')o.count=d.count;
  if(d.kind==='tek')o.count=1;
  if(d.kind==='sabit')o.every=d.every||1;
  if(d.end)o.end=d.end;
  if(d.closedAt)o.closedAt=d.closedAt;
  if(d.principal)o.principal=d.principal;
  if(d.steps&&d.steps.length)o.steps=d.steps.map(s=>({from:s.from,amount:s.amount}));
  if(d.total!=null)o.total=d.total;
  if(d.autoLast!=null)o.autoLast=d.autoLast;
  if(d.sample)o.sample=true;
  return o;
}
function payDoc(p){
  const o={debtId:p.debtId,n:p.n,date:p.date,amount:p.amount,method:p.method,note:p.note||'',createdAt:p.createdAt||Date.now()};
  if(p.sample)o.sample=true;
  return o;
}
const newId=pre=>pre+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function reindex(){
  DMAP=new Map(S.debts.map(d=>[d.id,d]));
  PIDX=new Map();PBYD=new Map();
  const sorted=S.payments.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  for(const p of sorted){
    const k=p.debtId+':'+p.n;
    (PIDX.get(k)||PIDX.set(k,[]).get(k)).push(p);
    (PBYD.get(p.debtId)||PBYD.set(p.debtId,[]).get(p.debtId)).push(p);
  }
}

/* ───────── hesap mantığı ───────── */
const isFin=d=>d.kind==='taksit'||d.kind==='tek';
const anchorOf=d=>P(d.first).d;
function dueOf(d,n){return addMonthsA(d.first,(n-1)*(d.every||1),anchorOf(d));}
function baseAmt(d,n){
  if(d.kind==='sabit'&&d.steps&&d.steps.length){const ym=ymOf(dueOf(d,n));let a=d.amount;for(const s of d.steps)if(s.from<=ym)a=s.amount;return a;}
  return d.amount;
}
function amtOf(d,n){const o=d.overrides&&d.overrides[n];return o!=null?o:baseAmt(d,n);}
function curAmt(d){if(d.kind!=='sabit'||!d.steps||!d.steps.length)return d.amount;const ym=ymOf(TODAY);let a=d.amount;for(const s of d.steps)if(s.from<=ym)a=s.amount;return a;}
function nextStep(d){if(d.kind!=='sabit'||!d.steps)return null;const ym=ymOf(TODAY);return d.steps.find(s=>s.from>ym)||null;}
function idxAtOrBefore(d,date){
  const every=d.every||1,k=ymDiff(ymOf(d.first),ymOf(date));
  if(k<0)return 0;
  let n=Math.floor(k/every)+1;
  if(dueOf(d,n)>date)n--;
  return Math.max(0,n);
}
function lastIdx(d){if(d.kind==='tek')return 1;if(d.kind==='taksit')return d.count;return d.end?idxAtOrBefore(d,d.end):Infinity;}
function effLast(d){let L=lastIdx(d);if(d.closedAt)L=Math.min(L,idxAtOrBefore(d,d.closedAt));return L;}
function occ(d,n){
  const due=dueOf(d,n);
  const pays=PIDX.get(d.id+':'+n)||[];
  let paid=0;for(const p of pays)paid+=p.amount;
  let amt=amtOf(d,n);
  const est=d.kind==='kart'&&!(d.overrides&&d.overrides[n]!=null);
  if(amt<=0&&paid>0)amt=paid;
  const once=n<=(d.paidBefore||0);
  const closed=!!(d.closedAt&&isFin(d));
  let st,late=false,tot=amt;
  if(once)st='once';
  else if(amt>0&&paid>=amt)st='odendi';
  else if(closed)st='kapandi';
  else if(amt<=0)st='tutar';
  else if(paid>0){if(d.kind==='kart'&&due<TODAY){st='devretti';tot=paid;}else{st='kismi';late=due<TODAY;}}
  else if(due<TODAY){st='gecikti';late=true;}
  else if(dayDiff(TODAY,due)<=3)st='yakin';
  else st='bekliyor';
  const settled=st==='once'||st==='kapandi';
  const paidEff=settled?tot:Math.min(paid,tot);
  return {d,n,due,amt,tot,paid,pays,st,late,paidEff,rest:Math.max(0,tot-paidEff),est};
}
function occInMonth(d,ym){
  const every=d.every||1,k=ymDiff(ymOf(d.first),ym);
  if(k<0||k%every)return null;
  const n=k/every+1;
  if(n>effLast(d))return null;
  return occ(d,n);
}
function occsThrough(d,date){const out=[],L=effLast(d);for(let n=1;n<=L&&n<=1200;n++){const due=dueOf(d,n);if(due>date)break;out.push(occ(d,n));}return out;}
const byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:(RANK[a.st]-RANK[b.st])||a.d.name.localeCompare(b.d.name,'tr');
const needsAction=o=>o.rest>0||o.st==='tutar';
const isDoneSt=st=>st==='odendi'||st==='once'||st==='kapandi'||st==='devretti';
const sumRest=a=>a.reduce((s,o)=>s+o.rest,0);
function monthData(ym,debts){
  const occs=[];
  for(const d of debts){const o=occInMonth(d,ym);if(o)occs.push(o);}
  occs.sort(byDue);
  let total=0,paid=0,rest=0;for(const o of occs){total+=o.tot;paid+=o.paidEff;rest+=o.rest;}
  return {ym,occs,total,paid,rest};
}
function overdue(debts){const out=[],y=addDays(TODAY,-1);for(const d of debts)for(const o of occsThrough(d,y))if(o.late&&o.rest>0)out.push(o);return out.sort(byDue);}
function upcoming(debts,from,to){
  const out=[];
  if(to<from)return out;
  for(const d of debts)for(let ym=ymOf(from);ym<=ymOf(to);ym=ymAdd(ym,1)){const o=occInMonth(d,ym);if(o&&o.due>=from&&o.due<=to&&needsAction(o))out.push(o);}
  return out.sort(byDue);
}
function summary(d){
  const pays=PBYD.get(d.id)||[];
  let paidSum=0;for(const p of pays)paidSum+=p.amount;
  const pb=d.paidBefore||0;
  if(isFin(d)){
    const L=lastIdx(d);let plan=0,before=0,paidCount=pb,next=null,lateN=0,lateAmt=0,firstLate=null;
    for(let n=1;n<=L;n++){
      const a=amtOf(d,n);
      if(n<=pb){before+=a;continue;}
      plan+=a;
      const o=occ(d,n);
      if(o.st==='odendi')paidCount++;
      else if(!d.closedAt){if(o.late){lateN++;lateAmt+=o.rest;if(!firstLate)firstLate=o;}else if(!next)next=o;}
    }
    return {fin:true,plan,before,paidSum,kalan:d.closedAt?0:Math.max(0,plan-paidSum),next,lateN,lateAmt,firstLate,last:dueOf(d,L),L,paidCount,pays};
  }
  const L=effLast(d),yr=TODAY.slice(0,4);
  let arrears=0,lateN=0,next=null,yearPaid=0,firstLate=null;
  for(const p of pays)if(p.date.slice(0,4)===yr)yearPaid+=p.amount;
  for(let n=pb+1;n<=L&&n<=1200;n++){
    const o=occ(d,n);
    if(o.due<TODAY){if(o.late&&o.rest>0){arrears+=o.rest;lateN++;if(!firstLate)firstLate=o;}continue;}
    if(needsAction(o)){next=o;break;}
  }
  return {fin:false,arrears,lateN,lateAmt:arrears,firstLate,next,yearPaid,paidSum,pays,L,last:Number.isFinite(L)&&L>0?dueOf(d,L):null};
}
function isDone(d){const s=summary(d);if(s.fin)return !!d.closedAt||s.kalan===0;return !!(d.end&&d.end<TODAY)&&s.arrears===0;}
function totals(debts){
  let finRest=0,arrears=0,monthly=0,free=null;
  for(const d of debts){
    const s=summary(d);
    if(s.fin){if(!d.closedAt&&s.kalan>0){finRest+=s.kalan;if(!free||s.last>free)free=s.last;if(d.kind==='taksit')monthly+=d.amount;}}
    else{arrears+=s.arrears;if(!(d.end&&d.end<TODAY))monthly+=Math.round(curAmt(d)/(d.every||1));}
  }
  return {finRest,arrears,monthly,free};
}
function perLabel(d,n){
  if(n===0)return 'Erken kapama';
  if(d.kind==='taksit')return n+'. taksit';
  if(d.kind==='tek')return 'Tek ödeme';
  const p=P(dueOf(d,n));
  return d.kind==='kart'?AYLAR[p.m-1]+' ekstresi':AYLAR[p.m-1]+' '+p.y;
}
function shortPer(o){
  const d=o.d;
  if(d.kind==='taksit')return 'Taksit '+o.n+'/'+d.count;
  if(d.kind==='tek')return CATS[d.cat].label;
  if(d.kind==='kart')return o.est?'Kart · tahmini':'Kart ekstresi';
  return EVERY[d.every];
}
function rateOf(a,P0){
  let T=0;for(const v of a)T+=v;
  if(!(P0>0)||T<=P0)return 0;
  const pv=r=>{let s=0,f=1;for(let i=0;i<a.length;i++){f/=(1+r);s+=a[i]*f;}return s;};
  let lo=0,hi=1;if(pv(hi)>P0)return null;
  for(let k=0;k<70;k++){const mid=(lo+hi)/2;if(pv(mid)>P0)lo=mid;else hi=mid;}
  return (lo+hi)/2;
}
function loanCost(d){
  if(d.kind!=='taksit'||!d.principal)return null;
  const a=[];let T=0;for(let n=1;n<=d.count;n++){const v=amtOf(d,n);a.push(v);T+=v;}
  const r=rateOf(a,d.principal);
  let remaining=0,payoff=0;
  if(!d.closedAt&&r!=null){
    for(let n=(d.paidBefore||0)+1;n<=d.count;n++){
      const o=occ(d,n);if(o.rest<=0)continue;
      remaining+=o.rest;
      const t=Math.max(0,dayDiff(TODAY,o.due))/30.4375;
      payoff+=o.rest/Math.pow(1+r,t);
    }
  }
  return {P:d.principal,T,interest:T-d.principal,r,annual:r!=null?Math.pow(1+r,12)-1:null,remaining,payoff:Math.round(payoff),saving:Math.max(0,Math.round(remaining-payoff))};
}
function relief(debts){
  const out=[];
  for(const d of debts){
    if(d.kind==='taksit'&&!d.closedAt){const s=summary(d);if(s.kalan<=0)continue;out.push({d,ym:ymOf(s.last),drop:d.amount});}
    else if(d.kind==='sabit'&&d.end&&d.end>=TODAY){out.push({d,ym:ymOf(d.end),drop:Math.round(curAmt(d)/(d.every||1))});}
  }
  return out.sort((a,b)=>a.ym<b.ym?-1:a.ym>b.ym?1:b.drop-a.drop);
}
function ledger(d){
  const pays=PBYD.get(d.id)||[],rows=[];
  if(isFin(d)){
    const s=summary(d),pb=d.paidBefore||0,L=lastIdx(d);
    const c=[pb<L?dueOf(d,pb+1):d.first];if(d.createdAt)c.push(tsYmd(d.createdAt));if(pays.length)c.push(pays[0].date);
    const desc=d.kind==='tek'?'Borç kaydı · vade '+dDot(d.first):pb>0?'Açılış · '+(pb+1)+'–'+L+'. taksitler ('+(L-pb)+' taksit)':'Borç kaydı · '+L+' taksit';
    rows.push({date:c.sort()[0],desc,dr:s.plan,t:0,n:0});
    for(const p of pays)rows.push({date:p.date,desc:(p.n===0?'Erken kapama ödemesi':perLabel(d,p.n))+' · '+METHODS[p.method]+(p.note?' · '+p.note:''),cr:p.amount,t:1,n:p.n});
    if(d.closedAt){
      const bal=s.plan-s.paidSum;
      if(bal>0)rows.push({date:d.closedAt,desc:'Kapama indirimi · kalan bakiye kapandı',cr:bal,t:2,n:1e9,adj:true});
      else if(bal<0)rows.push({date:d.closedAt,desc:'Kapama farkı · fazla ödeme',dr:-bal,t:2,n:1e9,adj:true});
    }
  }else{
    const pb=d.paidBefore||0,L=effLast(d);
    let top=idxAtOrBefore(d,TODAY);for(const p of pays)if(p.n>top)top=p.n;
    top=Math.min(L,top,1200);
    for(let n=pb+1;n<=top;n++){
      const o=occ(d,n);if(o.tot<=0)continue;
      const fp=o.pays.length?o.pays[0].date:null,pp=P(o.due);
      rows.push({date:fp&&fp<o.due?fp:o.due,desc:d.kind==='kart'?AYLAR[pp.m-1]+' ekstresi'+(o.est?' (tahmini)':'')+(o.st==='devretti'?' · kısmi, kalanı devretti':''):AYLAR[pp.m-1]+' '+pp.y+' tahakkuku',dr:o.tot,t:0,n});
    }
    for(const p of pays)rows.push({date:p.date,desc:perLabel(d,p.n)+' · '+METHODS[p.method]+(p.note?' · '+p.note:''),cr:p.amount,t:1,n:p.n});
  }
  rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t-b.t)||(a.n-b.n));
  let bal=0,tdr=0,tcr=0,adj=0;
  for(const r of rows){bal+=(r.dr||0)-(r.cr||0);r.bal=bal;if(r.adj)adj+=(r.dr||0)-(r.cr||0);else{tdr+=r.dr||0;tcr+=r.cr||0;}}
  return {rows,tdr,tcr,adj,bal};
}
function planRows(d){
  const out=[];
  if(isFin(d)){const L=lastIdx(d);for(let n=1;n<=L;n++)out.push(occ(d,n));return out;}
  const pb=d.paidBefore||0,L=effLast(d);
  const start=Math.max(pb+1,idxAtOrBefore(d,TODAY)-2,1);
  for(let n=start;n<=L&&out.length<15;n++)out.push(occ(d,n));
  return out;
}
function closedSet(){const c=S.settings.closed||[];return new Set(c.length>=7?[]:c);}
function openDaysBetween(a,b){if(b<=a)return 0;const cs=closedSet();const total=dayDiff(a,b);let n=0,w=wd(a);for(let i=0;i<total&&i<800;i++){if(!cs.has(w))n++;w=(w+1)%7;}return n;}
function needDaily(ev,cash){
  let cum=0,best={need:0,date:null,cum:0,days:0};
  for(const e of ev){cum+=e.amt;const days=openDaysBetween(TODAY,e.date);const nd=(cum-cash)/Math.max(1,days);if(nd>best.need)best={need:nd,date:e.date,cum,days};}
  best.need=best.need>0?Math.ceil(best.need/100)*100:0;
  return best;
}
function dailyAvg(debts){
  const ev=upcoming(debts,TODAY,addDays(TODAY,29)).filter(o=>o.rest>0);
  if(!ev.length)return 0;
  const days=Math.max(1,openDaysBetween(TODAY,addDays(TODAY,30)));
  return Math.ceil(sumRest(ev)/days/100)*100;
}
function cashEvents(debts){
  const ev=[];
  for(const o of overdue(debts))ev.push({date:TODAY,o,amt:o.rest,late:true});
  for(const o of upcoming(debts,TODAY,addDays(TODAY,29)))if(o.rest>0)ev.push({date:o.due,o,amt:o.rest});
  return ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function cashCalc(ev,cash,daily){
  let cum=0,firstNeg=null;const rows=[];
  for(const e of ev){
    cum+=e.amt;
    const days=openDaysBetween(TODAY,e.date),bal=cash+daily*days-cum;
    if(bal<0&&!firstNeg)firstNeg={date:e.date,short:-bal};
    rows.push({e,bal});
  }
  const nd=needDaily(ev,cash);
  return {rows,firstNeg,need:nd.need,needAt:nd,final:cash+daily*openDaysBetween(TODAY,addDays(TODAY,30))-cum,cum};
}
function weeksOf(ym){const out=[];let s=ym+'-01';while(s.slice(0,7)===ym){let e=addDays(s,(7-wd(s))%7);if(e.slice(0,7)!==ym)e=lastDayOf(ym);out.push({s,e});s=addDays(e,1);}return out;}
const bookSet=()=>new Set(S.debts.map(d=>d.book));
const multiBook=()=>bookSet().size>1;
function vis(){const m=multiBook();return S.debts.filter(d=>!m||S.book==='all'||d.book===S.book);}
const lastMethod=()=>{const m=LS.get('method','banka');return METHODS[m]?m:'banka';};

function insights(debts){
  const out=[],cur=ymOf(TODAY),md=monthData(cur,debts);
  const late=overdue(debts);
  if(late.length){
    const o=late[0],days=dayDiff(o.due,TODAY);
    out.push({tone:'late',icon:'alert',html:late.length===1?`<b>${esc(o.d.name)}</b> ${days} gündür gecikmede (${fmt(o.rest)} ₺).`:`<b>${late.length} ödeme</b> gecikmede, toplam ${fmt(sumRest(late))} ₺. En eskisi ${esc(o.d.name)}, ${days} gün.`,act:{a:'occ',id:o.d.id,n:o.n,label:'Öde'}});
  }
  const td=upcoming(debts,TODAY,TODAY).filter(o=>o.rest>0);
  if(td.length)out.push({tone:'soon',icon:'clock',html:td.length===1?`Bugün son gün: <b>${esc(td[0].d.name)}</b> (${fmt(td[0].rest)} ₺).`:`Bugün <b>${td.length} ödemenin</b> son günü, toplam ${fmt(sumRest(td))} ₺.`,act:td.length===1?{a:'occ',id:td[0].d.id,n:td[0].n,label:'Öde'}:null});
  else{const tm=upcoming(debts,addDays(TODAY,1),addDays(TODAY,1)).filter(o=>o.rest>0);if(tm.length)out.push({tone:'soon',icon:'clock',html:tm.length===1?`Yarın <b>${esc(tm[0].d.name)}</b> ödenecek (${tm[0].est?'~':''}${fmt(tm[0].rest)} ₺).`:`Yarın ${tm.length} ödeme var, toplam ${fmt(sumRest(tm))} ₺.`});}
  const cards=upcoming(debts,TODAY,addDays(TODAY,10)).filter(o=>o.d.kind==='kart'&&o.est);
  if(cards.length){const o=cards[0];out.push({tone:'info',icon:'card',html:`<b>${esc(o.d.name)}</b> için ${AYLAR[P(o.due).m-1]} ekstresini gir; şimdilik ${fmt(o.amt)} ₺ tahmin kullanılıyor.`,act:{a:'occ',id:o.d.id,n:o.n,label:'Ekstre gir'}});}
  const wks=weeksOf(cur).filter(w=>w.e>=TODAY).map(w=>Object.assign({},w,{sum:md.occs.filter(o=>o.due>=w.s&&o.due<=w.e).reduce((s,o)=>s+o.rest,0)})).filter(w=>w.sum>0);
  if(wks.length>=2){const mx=wks.reduce((a,b)=>b.sum>a.sum?b:a),tr=wks.reduce((s,w)=>s+w.sum,0),p=Math.round(mx.sum/tr*100);if(p>=40)out.push({icon:'week',html:`Ayın kalanındaki en yoğun hafta <b>${rangeLabel(mx.s,mx.e)}</b>: ${fmt(mx.sum)} ₺, kalan ödemelerin %${p} kadarı.`});}
  if(P(TODAY).d>=15){const nm=ymAdd(cur,1),nd=monthData(nm,debts);if(nd.total>0){const diff=nd.total-md.total;out.push({icon:'cal',html:`${AYLAR_DA[+nm.slice(5,7)-1]} ${fmt(nd.total)} ₺ ödeme var; ${diff===0?'bu ayla aynı.':`bu aydan ${fmt(Math.abs(diff))} ₺ ${diff>0?'fazla':'az'}.`}`,act:{a:'open-month',ym:nm,label:'Takvim'}});}}
  const rl=relief(debts).filter(r=>{const k=ymDiff(cur,r.ym);return k>=0&&k<=12;});
  if(rl.length){const r=rl[0];out.push({tone:'ok',icon:'down',html:`<b>${esc(r.d.name)}</b> ${ymLoc(r.ym)} bitiyor; sonra aylık yükün ${fmt(r.drop)} ₺ azalır.`,act:{a:'detail',id:r.d.id,label:'Ayrıntı'}});}
  const ids=new Set(debts.map(d=>d.id));let nk=0;for(const p of S.payments)if(ids.has(p.debtId)&&p.method==='nakit'&&ymOf(p.date)===cur)nk+=p.amount;
  if(nk>0)out.push({icon:'cash',html:`Bu ay nakitten ${fmt(nk)} ₺ ödeme yapıldı.`});
  const costs=debts.filter(d=>d.kind==='taksit'&&!d.closedAt).map(d=>({d,c:loanCost(d)})).filter(x=>x.c&&x.c.r>0&&summary(x.d).kalan>0).sort((a,b)=>b.c.r-a.c.r);
  if(costs.length)out.push({tone:'info',icon:'pct',html:`En pahalı kredin <b>${esc(costs[0].d.name)}</b>: aylık maliyet ≈ %${pctTR(costs[0].c.r)}. Fazladan ödeme en çok burada faiz düşürür.`,act:{a:'detail',id:costs[0].d.id,label:'Ayrıntı'}});
  return out;
}

/* ───────── parçalar ───────── */
function stInfo(o){
  const k=dayDiff(TODAY,o.due);
  switch(o.st){
    case 'odendi':return {text:'Ödendi',cls:'s-ok'};
    case 'once':return {text:'Önceden ödendi',cls:'s-mute'};
    case 'kapandi':return {text:'Kapandı',cls:'s-mute'};
    case 'devretti':return {text:'Kısmi ödendi, kalanı devretti',cls:'s-mute'};
    case 'tutar':return {text:o.d.kind==='kart'?'Ekstre girilmedi':'Tutar girilmedi',cls:'s-soon'};
    case 'kismi':return o.late?{text:`Kısmi · ${-k} gün gecikti`,cls:'s-late'}:{text:`Kısmi · ${fmt(o.rest)} ₺ kaldı`,cls:'s-info'};
    case 'gecikti':return {text:`${-k} gün gecikti`,cls:'s-late'};
    case 'yakin':return {text:k===0?'Bugün son gün':k===1?'Yarın':`${k} gün kaldı`,cls:'s-soon'};
    default:return {text:k<=14?`${k} gün kaldı`:'',cls:'s-mute'};
  }
}
function actHTML(o){

function calendarHTML(md){
  const ym=md.ym,y=+ym.slice(0,4),m=+ym.slice(5,7),n=dim(y,m),off=(wd(ym+'-01')+6)%7,cs=closedSet();
  const byDay=new Map();for(const o of md.occs)(byDay.get(o.due)||byDay.set(o.due,[]).get(o.due)).push(o);
  let max=0;for(const arr of byDay.values()){const t=arr.reduce((s,o)=>s+o.tot,0);if(t>max)max=t;}
  let h=`<div class="cal" role="group" aria-label="${ymLabel(ym)} takvimi">`;
  for(let i=0;i<7;i++)h+=`<span class="cal-h${cs.has((i+1)%7)?' off':''}" aria-hidden="true">${GUNK_MON[i]}</span>`;
  for(let i=0;i<off;i++)h+='<span class="cd" aria-hidden="true"></span>';
  for(let day=1;day<=n;day++){
    const s=ymd(y,m,day),arr=byDay.get(s),cls=(s===TODAY?' today':'')+(cs.has(wd(s))?' off':'');
    if(!arr){h+=`<span class="cd${cls}"><span class="cd-n">${day}</span></span>`;continue;}
    const t=arr.reduce((a,o)=>a+o.tot,0),lev=max&&t>=max*0.66?3:max&&t>=max*0.33?2:1;
    const anyLate=arr.some(o=>o.late&&o.rest>0),allDone=arr.every(o=>isDoneSt(o.st));
    const mk=anyLate?'late':allDone?'done':'open';
    const label=`${day} ${AYLAR[m-1]} ${GUNLER[wd(s)]}: ${arr.length} ödeme, ${fmt(t)} TL${anyLate?', gecikmiş var':allDone?', hepsi ödendi':''}`;
    h+=`<button type="button" class="cd h${lev}${cls}${S.day===s?' sel':''}" data-action="day" data-d="${s}" aria-pressed="${S.day===s}" aria-label="${esc(label)}"><span class="cd-n">${day}</span><span class="cd-a">${fmtK(t)}</span><i class="mk ${mk}"></i></button>`;
  }
  h+='</div>';
  const offNames=[...cs].sort((a,b)=>((a+6)%7)-((b+6)%7)).map(w=>GUNLER[w]);
  h+=`<p class="cal-legend"><span><i class="mk late"></i>Geciken</span><span><i class="mk open"></i>Bekleyen</span><span><i class="mk done"></i>Ödendi</span><span>b = bin ₺</span>${offNames.length?`<span>${offNames.join(', ')} kapalı</span>`:''}</p>`;
  return h;
}
function weeksHTML(md){

  else if(d.kind==='tek'){amt=s.kalan;sub='kalan';meta='Vade '+dShortY(d.first);if(s.paidSum>0&&s.plan>0)bar=pbar(Math.min(100,Math.round(s.paidSum/s.plan*100)));}
  else if(d.kind==='kart'){amt=s.next?s.next.tot:0;sub=s.next&&s.next.est?'tahmini':'sıradaki';meta=`Son ödeme her ayın ${day}${gunEki(day)}`;}
  else{amt=curAmt(d);sub=EVERY[d.every].toLowerCase();meta=`Ayın ${day}${gunEki(day)}${d.end?' · bitiş '+dShortY(d.end):''}`;}
  if(d.closedAt)meta+=` · ${dShortY(d.closedAt)} kapatıldı`;
  const parts=[];
  if(s.lateN)parts.push(`<span class="st s-late">${d.kind==='tek'?'Gecikmede':s.lateN+(d.kind==='taksit'?' taksit':' dönem')+' gecikmede'} · ${fmt(s.lateAmt)} ₺</span>`);
  if(s.next&&!d.closedAt){const k=dayDiff(TODAY,s.next.due);parts.push(`Sıradaki ${dShort(s.next.due)} · ${s.next.est?'~':''}${fmt(s.next.rest||s.next.tot)} ₺${k<=3?` · <span class="st s-soon">${k===0?'bugün':k===1?'yarın':k+' gün'}</span>`:''}`);}

    <span class="acc-name">${esc(d.name)}${prioBadge(d)}${sampleTag(d)}</span><span class="acc-amt tnum">${fmt(amt)}</span>
    <span class="acc-meta">${esc(CATS[d.cat].label)} · ${esc(meta)}${multiBook()?' · '+BOOKS[d.book]:''}</span><span class="acc-sub">${sub}</span>

function viewBorclar(){
  if(S.detail){const d=DMAP.get(S.detail);if(d)return viewDetail(d);S.detail=null;}

  h+=`<div class="sumcard"><div><span>Kalan borç</span><b>${fmt0(tot.finRest)} ₺</b></div><div><span>Aylık yük</span><b>${fmt0(tot.monthly)} ₺</b></div><div><span>Borçsuz kalma</span><b>${fp?AYK[fp.m-1]+' '+fp.y:'—'}</b></div></div>`;

function planSt(o){
  switch(o.st){
    case 'odendi':return {t:'Ödendi',c:'s-ok'};
