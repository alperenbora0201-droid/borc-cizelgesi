<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Borç Çizelgesi</title>
<meta name="description" content="Aylık borç ve ödeme çizelgesi: her ödemeyi tek dokunuşla ödendi işaretle.">
<meta name="theme-color" content="#F3F4F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Borçlar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>
:root{
  /* Layout: tek sütun. Üstte lacivert ay kartı, altında ödeme listesi; her satırın sağında tek dokunuşluk "Ödedim" düğmesi. Altta iki sekme ve sarı ekle düğmesi. */
  --bg:#F3F4F8; --surface:#FFFFFF; --chip:#EDEFF5; --line:#E1E4ED; --line-2:#C7CCDB;
  --ink:#141A33; --ink-2:#474E6B; --ink-3:#61688A;
  --navy:#18214A; --navy-2:#24305F; --on-navy:#F4F5FB; --on-navy-2:#B4BBDB; --navy-track:#36427A;
  --saffron:#F0A92B; --saffron-ink:#8A5A00; --on-saffron:#18214A;
  --primary:#18214A; --on-primary:#FFFFFF;
  --ok:#187049; --on-ok:#FFFFFF; --ok-soft:#E1F3EA;
  --late:#C0342B; --late-soft:#FCE5E2; --late-on-navy:#FF9F93;
  --soon:#9A5B00; --soon-soft:#FDF0D9;
  --info:#2C55C7; --info-soft:#E4EBFC;
  --scrim:rgba(14,18,34,.5);
  --shadow:0 1px 2px rgba(20,26,51,.06),0 12px 30px -16px rgba(20,26,51,.42);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1120; --surface:#161B2F; --chip:#1F2541; --line:#272E4A; --line-2:#3A4366;
    --ink:#E9EBF5; --ink-2:#B6BCD6; --ink-3:#8D94B3;
    --navy:#1F2B60; --navy-2:#2A3876; --on-navy:#F4F5FB; --on-navy-2:#BAC1E3; --navy-track:#3B4888;
    --saffron:#F2B23E; --saffron-ink:#F2B23E; --on-saffron:#141A33;
    --primary:#F2B23E; --on-primary:#141A33;
    --ok:#4CC38A; --on-ok:#0B1F14; --ok-soft:#12301F;
    --late:#F07A6E; --late-soft:#3A1A18; --late-on-navy:#FFA59A;
    --soon:#E9A83A; --soon-soft:#33270F;
    --info:#8DA8F5; --info-soft:#1A2547;
    --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 38px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2F; --chip:#1F2541; --line:#272E4A; --line-2:#3A4366;
  --ink:#E9EBF5; --ink-2:#B6BCD6; --ink-3:#8D94B3;
  --navy:#1F2B60; --navy-2:#2A3876; --on-navy:#F4F5FB; --on-navy-2:#BAC1E3; --navy-track:#3B4888;
  --saffron:#F2B23E; --saffron-ink:#F2B23E; --on-saffron:#141A33;
  --primary:#F2B23E; --on-primary:#141A33;
  --ok:#4CC38A; --on-ok:#0B1F14; --ok-soft:#12301F;
  --late:#F07A6E; --late-soft:#3A1A18; --late-on-navy:#FFA59A;
  --soon:#E9A83A; --soon-soft:#33270F;
  --info:#8DA8F5; --info-soft:#1A2547;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 38px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.hint{font-size:13px;line-height:1.45;color:var(--ink-3)}
.quiet{font-size:15px;color:var(--ink-3);padding:4px 2px}
.s-late{color:var(--late)} .s-soon{color:var(--soon)} .s-ok{color:var(--ok)} .s-info{color:var(--info)} .s-mute{color:var(--ink-3)}
.link{appearance:none;background:none;border:0;padding:6px 0;color:var(--info);font-weight:750;font-size:15px;cursor:pointer;text-align:left}

/* üst */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand-mark{flex:none;width:36px;height:36px;border-radius:11px;background:var(--navy);display:grid;place-items:center}
.brand-mark svg{width:25px;height:25px}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1}
.brand-date{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.icon-btn svg{width:22px;height:22px}

.main{max-width:600px;margin:0 auto;padding-top:4px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

/* uyarılar */
.banner{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 14px;border-radius:16px;background:var(--info-soft);font-size:14px;line-height:1.45}
.banner > .bt{flex:1 1 200px;min-width:0}
.banner.warn{background:var(--soon-soft)}
.banner.has-x{padding-right:48px}
.banner .x{position:absolute;top:6px;right:6px;width:38px;height:38px;border:0;background:none;border-radius:10px;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer}
.banner .btn{min-height:40px;padding:0 14px;font-size:14px}

/* ay kartı */
.sum{background:var(--navy);color:var(--on-navy);border-radius:22px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.mnav{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:6px}
.mnav button{width:46px;height:46px;border-radius:14px;border:0;background:var(--navy-2);color:var(--on-navy);display:grid;place-items:center;cursor:pointer}
.mnav button svg{width:22px;height:22px}
.mnav h1{text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.sum-body{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.sum-lbl{font-size:14px;color:var(--on-navy-2);font-weight:650}
.sum-fig{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,13vw,56px);line-height:1;letter-spacing:-.025em;overflow-wrap:anywhere}
.sum-fig .dec{font-size:.5em;letter-spacing:0;color:var(--on-navy-2);font-weight:600}
.sum-fig .cur{font-size:.44em;margin-left:.2em;color:var(--saffron);font-weight:750}
.sum-bar{height:9px;border-radius:999px;background:var(--navy-track);overflow:hidden}
.sum-bar span{display:block;height:100%;background:var(--saffron);border-radius:999px}
.sum-sub{font-size:14px;color:var(--on-navy-2)}
.sum-sub b{color:var(--on-navy);font-weight:750}
.sum-chips{display:flex;flex-wrap:wrap;gap:6px}
.sum-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--navy-2);font-size:13.5px;font-weight:750;color:var(--on-navy);border:0;cursor:default}
.sum-chip.bad{color:var(--late-on-navy)}
button.sum-chip{cursor:pointer;color:var(--saffron)}

/* liste */
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:72px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px}
.sec-h h2{font-family:var(--f-display);font-weight:750;font-size:19px}
.sec-h span{font-size:14.5px;font-weight:750;color:var(--ink-2);white-space:nowrap}
.sec.late .sec-h h2,.sec.late .sec-h span{color:var(--late)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.r{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 12px}
.r + .r{border-top:1px solid var(--line)}
.r-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:2px 0;margin:0;text-align:left;cursor:pointer;color:inherit;border-radius:12px}
.r-day{flex:none;width:48px;height:52px;border-radius:14px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1}
.r-day b{font-family:var(--f-display);font-weight:750;font-size:21px}
.r-day i{font-style:normal;font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.r-day.today{background:var(--navy);color:var(--on-navy)}
.r-day.today i{color:var(--saffron)}
.is-late .r-day{background:var(--late-soft);color:var(--late)}
.is-late .r-day i{color:var(--late)}
.r-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.r-name{font-weight:750;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.r-amt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.r-sub{font-size:13px;color:var(--ink-3);line-height:1.35}
.r-sub .st{font-weight:750}
.is-done .r-name,.is-done .r-amt{color:var(--ink-3)}
.is-done .r-amt{font-weight:650}
.pay{flex:none;min-width:96px;min-height:48px;padding:0 14px;border-radius:15px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pay svg{width:18px;height:18px;flex:none}
.pay.on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.pay.ghost{border-style:dashed;color:var(--ink-3);cursor:default;font-weight:650}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;border:1px dashed var(--line-2);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.6;color:var(--ink-3);vertical-align:2px}
.alldone{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--ok-soft);color:var(--ok);font-weight:750;font-size:15px}
.alldone svg{width:24px;height:24px;flex:none}

/* borçlarım */
.vhead{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.vtitle{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.sub{font-size:14.5px;color:var(--ink-2)}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--navy);color:var(--on-navy);border-radius:20px;padding:15px 16px}
.tot > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.tot span{font-size:12.5px;font-weight:650;color:var(--on-navy-2)}
.tot b{font-size:clamp(15px,4.4vw,18px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.accs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.accs li + li{border-top:1px solid var(--line)}
.acc{width:100%;appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.acc-name{font-weight:750;font-size:16px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.acc-amt{font-weight:800;font-size:16px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.acc-sub{font-size:13px;color:var(--ink-3);min-width:0}
.acc-unit{font-size:12px;font-weight:700;color:var(--ink-3);text-align:right;white-space:nowrap}
.acc .bar{grid-column:1/-1;height:7px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:6px}
.acc .bar span{display:block;height:100%;border-radius:999px;background:var(--navy)}
:root[data-theme="dark"] .acc .bar span{background:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acc .bar span{background:var(--saffron)}}
.acc-late{grid-column:1/-1;font-size:13px;font-weight:750;color:var(--late)}
.more{display:flex;flex-direction:column;gap:10px}
.more > summary{cursor:pointer;font-weight:750;font-size:15px;color:var(--ink-2);padding:6px 2px}

/* boş */
.empty{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.empty .vtitle{font-size:28px}

/* düğmeler */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:750;font-size:15.5px;line-height:1.15;cursor:pointer;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn.armed{background:var(--late);border-color:var(--late);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;background:var(--chip);border-radius:14px}
.seg label{position:relative;display:block;min-width:0}
.seg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.seg span,.seg button{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 6px;border-radius:11px;font-weight:750;font-size:14.5px;line-height:1.15;color:var(--ink-2)}
.seg button{width:100%;appearance:none;border:0;background:none;cursor:pointer}
.seg input:checked + span,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,51,.16)}
.seg input:focus-visible + span{outline:2px solid var(--info);outline-offset:1px}

/* sekmeler */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);height:68px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tab{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:12.5px;font-weight:750;min-width:0}
.tab svg{width:46px;height:30px;padding:3px 11px;border-radius:999px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{background:var(--chip)}
.fab{justify-self:center;align-self:center;width:62px;height:62px;border-radius:20px;background:var(--saffron);color:var(--on-saffron);border:0;display:grid;place-items:center;box-shadow:var(--shadow);transform:translateY(-16px);cursor:pointer}
.fab svg{width:28px;height:28px}

/* alt sayfa */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.panel{position:relative;width:100%;max-width:600px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:calc(100% - 14px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.panel-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;min-height:60px;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel-bar .t{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.panel-bar .l{justify-self:start}
.bar-btn{min-height:46px;padding:0 2px;background:none;border:0;font-weight:650;font-size:15.5px;color:var(--ink-2);cursor:pointer}
.panel-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:18px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
@keyframes rise{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;flex-direction:column;gap:4px}
.sh-date{font-size:14px;color:var(--ink-3);font-weight:650}
.sh-name{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.sh-amt{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sh-st{font-size:14.5px;font-weight:750}
.bigpay{width:100%;min-height:58px;border-radius:17px;border:0;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.bigpay svg{width:22px;height:22px}
.bigpay.on{background:var(--ok);color:var(--on-ok)}
.note{padding:12px 14px;border-radius:14px;background:var(--chip);font-size:14.5px;color:var(--ink-2)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .btn{justify-content:flex-start}
.menu-sec{display:flex;flex-direction:column;gap:6px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.textbox{min-height:220px;font-size:14px;text-align:left;font-weight:500}

/* form */
.form{display:flex;flex-direction:column;gap:16px}
.fs{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.fs legend{padding:0;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.lab{font-size:14px;font-weight:750;color:var(--ink-2)}
.in{width:100%;min-height:54px;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.25}
.in:focus{outline:2px solid var(--info);outline-offset:0;border-color:var(--info)}
.amt-in,.num-in{font-variant-numeric:tabular-nums;font-weight:750}
.in[aria-invalid="true"]{border-color:var(--late)}
input[type="date"].in{-webkit-appearance:none;appearance:none}
.err{color:var(--late);font-size:13.5px;font-weight:650}
.err:empty{display:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.check{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:650;color:var(--ink);cursor:pointer;padding:12px 14px;border-radius:14px;background:var(--ok-soft)}
.check input{width:22px;height:22px;accent-color:var(--ok);margin:0;flex:none}
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{appearance:none;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:15px;font-weight:700;color:var(--ink-2);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.preview{padding:12px 14px;border-radius:14px;background:var(--chip);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.preview b{color:var(--ink);font-weight:800}
.inline{display:flex;gap:8px}
.inline .in{flex:1;min-width:0}
.more-f{border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.more-f[open]{padding-bottom:14px}
.more-f > summary{cursor:pointer;font-weight:750;font-size:15px;color:var(--ink-2);padding:10px 0}

/* bildirim */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:4px;width:max-content;max-width:min(560px,calc(100% - 32px));padding:6px 6px 6px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:15px;line-height:1.35;animation:fade .2s ease-out}
.toast .msg{flex:1;min-width:0;padding:8px 0}
.toast button{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.toast{animation:none}}

<script>
(function(){
'use strict';

/* ───────── simgeler ───────── */
const SV='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const ICON={
  ay:`<svg ${SV}><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.2 12.2l2.6 2.6 5-5.4"/></svg>`,
  borclar:`<svg ${SV}><rect x="4" y="3.75" width="16" height="16.5" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  menu:`<svg ${SV}><circle cx="12" cy="5.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="18.5" r="1.3" fill="currentColor"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  left:`<svg ${SV}><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>`,
  right:`<svg ${SV}><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>`,
  share:`<svg ${SV}><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/></svg>`,
  bell:`<svg ${SV}><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>`,
  shield:`<svg ${SV}><path d="M12 3.5l7 3v5.5c0 4.3-3 7.6-7 8.5-4-.9-7-4.2-7-8.5V6.5z"/><path d="M9 12l2 2 4-4"/></svg>`,
  upload:`<svg ${SV}><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19.5h14"/></svg>`,
  phone:`<svg ${SV}><rect x="6.5" y="2.75" width="11" height="18.5" rx="2.5"/><path d="M11 18h2"/></svg>`,
  party:`<svg ${SV}><circle cx="12" cy="12" r="8.25"/><path d="M8.2 12.2l2.6 2.6 5-5.4"/></svg>`
};

/* ───────── sabitler ───────── */
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const AYLAR_DA=["Ocak'ta","Şubat'ta","Mart'ta","Nisan'da","Mayıs'ta","Haziran'da","Temmuz'da","Ağustos'ta","Eylül'de","Ekim'de","Kasım'da","Aralık'ta"];
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GUNK=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const KINDS={taksit:1,kart:1,sabit:1,tek:1};
const CATS={banka:'onemli',kart:'onemli',kira:'onemli',sgk:'kritik',vergi:'kritik',personel:'kritik',fatura:'onemli',tedarik:'onemli',cek:'kritik',senet:'kritik',elden:'esnek',diger:'onemli'};
const PRIOS={kritik:1,onemli:1,esnek:1};
const DEFCAT={taksit:'banka',kart:'kart',sabit:'kira',tek:'tedarik'};
const PICKS=[
  {l:'Kira',name:'Kira',cat:'kira',mode:'ay'},
  {l:'SGK',name:'SGK primi',cat:'sgk',mode:'ay'},
  {l:'Kredi',name:'Kredi',cat:'banka',mode:'taksit'},
  {l:'Kredi kartı',name:'Kredi kartı',cat:'kart',mode:'ay',card:true},
  {l:'Fatura',name:'Fatura',cat:'fatura',mode:'ay'},
  {l:'Maaş',name:'Maaş',cat:'personel',mode:'ay'},
  {l:'Çek',name:'Çek',cat:'cek',mode:'tek'},
  {l:'Senet',name:'Senet',cat:'senet',mode:'tek'},
  {l:'Diğer',name:'',cat:'diger',mode:null}
];
const METHODS={banka:'Banka / POS',nakit:'Nakit',kart:'Kredi kartı'};
const RANK={gecikti:0,kismi:1,yakin:1,tutar:1,bekliyor:2,odendi:3,devretti:3,once:4,kapandi:4};

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ───────── tarih ───────── */
const pad2=n=>String(n).padStart(2,'0');
function localToday(){const t=new Date();return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());}
function P(s){return {y:+s.slice(0,4),m:+s.slice(5,7),d:+s.slice(8,10)};}
function ymd(y,m,d){return y+'-'+pad2(m)+'-'+pad2(d);}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
function addMonthsA(s,k,anchor){const p=P(s);let t=p.m-1+k;const y=p.y+Math.floor(t/12);t=((t%12)+12)%12;const m=t+1;return ymd(y,m,Math.min(anchor||p.d,dim(y,m)));}
const ymOf=s=>s.slice(0,7);
function ymAdd(ym,k){let y=+ym.slice(0,4),t=+ym.slice(5,7)-1+k;y+=Math.floor(t/12);t=((t%12)+12)%12;return y+'-'+pad2(t+1);}
function ymDiff(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));}
function utc(s){const p=P(s);return Date.UTC(p.y,p.m-1,p.d);}
function dayDiff(a,b){return Math.round((utc(b)-utc(a))/864e5);}
function addDays(s,k){const t=new Date(utc(s)+k*864e5);return ymd(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate());}
function wd(s){return new Date(utc(s)).getUTCDay();}
function dShort(s){const p=P(s);return p.d+' '+AYK[p.m-1];}
function dShortY(s){const p=P(s);return p.d+' '+AYK[p.m-1]+' '+p.y;}
function dLong(s){const p=P(s);return p.d+' '+AYLAR[p.m-1]+' '+p.y+', '+GUNLER[wd(s)];}
function dMed(s){const p=P(s);return p.d+' '+AYLAR[p.m-1]+(p.y!==+TODAY.slice(0,4)?' '+p.y:'')+' '+GUNLER[wd(s)];}
function ymLabel(ym){return AYLAR[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
function ymShort(ym){return AYK[+ym.slice(5,7)-1]+' '+ym.slice(0,4);}
function lastDayOf(ym){return ym+'-'+pad2(dim(+ym.slice(0,4),+ym.slice(5,7)));}
function gunEki(d){const l=d%10;if(l===0)return d===20?"'si":"'u";return ({1:"'i",2:"'si",3:"'ü",4:"'ü",5:"'i",6:"'sı",7:"'si",8:"'i",9:"'u"})[l];}
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function validDate(s){if(typeof s!=='string'||!DATE_RE.test(s))return false;const p=P(s);return p.y>=1990&&p.y<=2200&&p.m>=1&&p.m<=12&&p.d>=1&&p.d<=dim(p.y,p.m);}

/* ───────── para (kuruş) ───────── */
const NF2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NF0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
const fmt=k=>NF2.format((k||0)/100);
const fmt0=k=>NF0.format(Math.round((k||0)/100));
const money=k=>{const s=fmt(k);return s.endsWith(',00')?s.slice(0,-3):s;};
function heroNum(k){const s=fmt(k),i=s.lastIndexOf(',');return esc(s.slice(0,i))+'<span class="dec">'+esc(s.slice(i))+'</span>';}
function parseTL(str){
  if(str==null)return NaN;
  let s=String(str).replace(/\s|₺/g,'').replace(/tl$/i,'');
  if(!s)return NaN;
  const hasDot=s.includes('.'),hasComma=s.includes(',');
  if(hasDot&&hasComma)s=s.replace(/\./g,'').replace(',','.');
  else if(hasComma)s=s.replace(',','.');
  else if(hasDot){const parts=s.split('.');if(parts.length>2||parts[parts.length-1].length===3)s=parts.join('');}
  if(!/^\d+(\.\d+)?$/.test(s))return NaN;
  return Math.round(parseFloat(s)*100);
}

/* ───────── durum ───────── */
let TODAY=localToday();
const LS={
  get(k,def){try{const v=localStorage.getItem('borc-cizelgesi.ui.'+k);return v==null?def:JSON.parse(v);}catch(e){return def;}},
  set(k,v){try{localStorage.setItem('borc-cizelgesi.ui.'+k,JSON.stringify(v));}catch(e){}}
};
const S={tab:'ay',month:ymOf(TODAY),debts:[],payments:[],settings:{remind:false,remindBg:false,theme:'system'},openDone:false};
let DMAP=new Map(),PIDX=new Map(),PBYD=new Map();
let SHEET=null,IMPORT=null,INSTALL=null,DATA=null;

/* ───────── kayıt temizliği (eski sürümle uyumlu) ───────── */
const ID_RE=/^[A-Za-z0-9_\-.~:@+]{1,150}$/;
const validId=s=>typeof s==='string'&&ID_RE.test(s);
const intOr=(v,def)=>Number.isFinite(v)?Math.round(v):def;
function cleanDebt(id,x){
  if(!x||typeof x!=='object'||!KINDS[x.kind]||!validDate(x.first))return null;
  const kind=x.kind,cat=CATS[x.cat]?x.cat:DEFCAT[kind];
  const d={id,kind,cat,
    name:typeof x.name==='string'&&x.name.trim()?x.name.trim().slice(0,80):'Adsız borç',
    book:x.book==='kisisel'?'kisisel':'isletme',
    prio:PRIOS[x.prio]?x.prio:CATS[cat],
    amount:Math.max(0,intOr(x.amount,0)),
    count:kind==='taksit'?Math.min(600,Math.max(1,intOr(x.count,1))):(kind==='tek'?1:null),
    first:x.first,
    day:(kind==='sabit'||kind==='kart')&&Number.isInteger(x.day)&&x.day>=1&&x.day<=31?x.day:null,
    every:kind==='sabit'&&[1,2,3,6,12].includes(x.every)?x.every:1,
    end:(kind==='sabit'||kind==='kart')&&validDate(x.end)?x.end:null,
    paidBefore:kind==='tek'?0:Math.max(0,intOr(x.paidBefore,0)),
    closedAt:(kind==='taksit'||kind==='tek')&&validDate(x.closedAt)?x.closedAt:null,
    principal:kind==='taksit'&&Number.isFinite(x.principal)&&x.principal>0?Math.round(x.principal):null,
    steps:kind==='sabit'&&Array.isArray(x.steps)?x.steps.filter(s=>s&&typeof s.from==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(s.from)&&Number.isFinite(s.amount)&&s.amount>=0).map(s=>({from:s.from,amount:Math.round(s.amount)})).sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0).slice(0,60):[],
    note:typeof x.note==='string'?x.note.slice(0,300):'',
    overrides:{},
    total:Number.isFinite(x.total)?Math.round(x.total):null,
    autoLast:Number.isFinite(x.autoLast)?Math.round(x.autoLast):null,
    sample:x.sample===true,
    createdAt:intOr(x.createdAt,0)};
  if(kind==='taksit'&&d.paidBefore>d.count)d.paidBefore=d.count;
  if(x.overrides&&typeof x.overrides==='object')for(const k in x.overrides){const n=parseInt(k,10),v=x.overrides[k];if(n>=1&&Number.isFinite(v)&&v>=0)d.overrides[n]=Math.round(v);}
  return d;
}
function cleanPay(id,x){
  if(!x||typeof x!=='object'||typeof x.debtId!=='string'||!x.debtId)return null;
  const n=intOr(x.n,-1),amount=intOr(x.amount,0);
  if(n<0||amount<=0||!validDate(x.date))return null;
  return {id,debtId:x.debtId,n,date:x.date,amount,method:METHODS[x.method]?x.method:'banka',
    note:typeof x.note==='string'?x.note.slice(0,200):'',createdAt:intOr(x.createdAt,0),sample:x.sample===true};
}
function cleanSettings(x){
  const o=Object.assign({},x&&typeof x==='object'?x:{});
  o.remind=o.remind===true;o.remindBg=o.remindBg===true;
  if(!['system','light','dark'].includes(o.theme))o.theme='system';
  return o;
}
function debtDoc(d){
  const o={kind:d.kind,name:d.name,cat:d.cat,book:d.book,prio:d.prio,amount:d.amount,first:d.first,paidBefore:d.paidBefore||0,
    note:d.note||'',overrides:Object.assign({},d.overrides||{}),createdAt:d.createdAt||Date.now(),updatedAt:Date.now()};
  if(d.kind==='taksit')o.count=d.count;
  if(d.kind==='tek')o.count=1;
  if(d.kind==='sabit')o.every=d.every||1;
  if(d.day)o.day=d.day;
  if(d.end)o.end=d.end;
  if(d.closedAt)o.closedAt=d.closedAt;
  if(d.principal)o.principal=d.principal;
  if(d.steps&&d.steps.length)o.steps=d.steps.map(s=>({from:s.from,amount:s.amount}));
  if(d.total!=null)o.total=d.total;
  if(d.autoLast!=null)o.autoLast=d.autoLast;
  if(d.sample)o.sample=true;
  return o;
}
function payDoc(p){const o={debtId:p.debtId,n:p.n,date:p.date,amount:p.amount,method:p.method,note:p.note||'',createdAt:p.createdAt||Date.now()};if(p.sample)o.sample=true;return o;}
const newId=pre=>pre+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function reindex(){
  DMAP=new Map(S.debts.map(d=>[d.id,d]));
  PIDX=new Map();PBYD=new Map();
  const sorted=S.payments.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  for(const p of sorted){
    const k=p.debtId+':'+p.n;
    (PIDX.get(k)||PIDX.set(k,[]).get(k)).push(p);
    (PBYD.get(p.debtId)||PBYD.set(p.debtId,[]).get(p.debtId)).push(p);
  }
}

/* ───────── hesap ───────── */
const isFin=d=>d.kind==='taksit'||d.kind==='tek';
const anchorOf=d=>d.day||P(d.first).d;
function dueOf(d,n){return addMonthsA(d.first,(n-1)*(d.every||1),anchorOf(d));}
function baseAmt(d,n){
  if(d.kind==='sabit'&&d.steps&&d.steps.length){const ym=ymOf(dueOf(d,n));let a=d.amount;for(const s of d.steps)if(s.from<=ym)a=s.amount;return a;}
  return d.amount;
}
function amtOf(d,n){const o=d.overrides&&d.overrides[n];return o!=null?o:baseAmt(d,n);}
function curAmt(d){if(d.kind!=='sabit'||!d.steps||!d.steps.length)return d.amount;const ym=ymOf(TODAY);let a=d.amount;for(const s of d.steps)if(s.from<=ym)a=s.amount;return a;}
function idxAtOrBefore(d,date){
  const every=d.every||1,k=ymDiff(ymOf(d.first),ymOf(date));
  if(k<0)return 0;
  let n=Math.floor(k/every)+1;
  if(dueOf(d,n)>date)n--;
  return Math.max(0,n);
}
function lastIdx(d){if(d.kind==='tek')return 1;if(d.kind==='taksit')return d.count;return d.end?idxAtOrBefore(d,d.end):Infinity;}
function effLast(d){let L=lastIdx(d);if(d.closedAt)L=Math.min(L,idxAtOrBefore(d,d.closedAt));return L;}
function occ(d,n){
  const due=dueOf(d,n);
  const pays=PIDX.get(d.id+':'+n)||[];
  let paid=0;for(const p of pays)paid+=p.amount;
  let amt=amtOf(d,n);
  const est=d.kind==='kart'&&!(d.overrides&&d.overrides[n]!=null);
  if(amt<=0&&paid>0)amt=paid;
  const once=n<=(d.paidBefore||0);
  const closed=!!(d.closedAt&&isFin(d));
  let st,late=false,tot=amt;
  if(once)st='once';
  else if(amt>0&&paid>=amt)st='odendi';
  else if(closed)st='kapandi';
  else if(amt<=0)st='tutar';
  else if(paid>0){if(d.kind==='kart'&&due<TODAY){st='devretti';tot=paid;}else{st='kismi';late=due<TODAY;}}
  else if(due<TODAY){st='gecikti';late=true;}
  else if(dayDiff(TODAY,due)<=3)st='yakin';
  else st='bekliyor';
  const settled=st==='once'||st==='kapandi';
  const paidEff=settled?tot:Math.min(paid,tot);
  return {d,n,due,amt,tot,paid,pays,st,late,paidEff,rest:Math.max(0,tot-paidEff),est};
}
function occInMonth(d,ym){
  const every=d.every||1,k=ymDiff(ymOf(d.first),ym);
  if(k<0||k%every)return null;
  const n=k/every+1;
  if(n>effLast(d))return null;
  return occ(d,n);
}
function occsThrough(d,date){const out=[],L=effLast(d);for(let n=1;n<=L&&n<=1200;n++){const due=dueOf(d,n);if(due>date)break;out.push(occ(d,n));}return out;}
const byDue=(a,b)=>a.due<b.due?-1:a.due>b.due?1:(RANK[a.st]-RANK[b.st])||a.d.name.localeCompare(b.d.name,'tr');
const needsAction=o=>o.rest>0||o.st==='tutar';
const isDoneSt=st=>st==='odendi'||st==='once'||st==='kapandi'||st==='devretti';
const sumRest=a=>a.reduce((s,o)=>s+o.rest,0);
function monthData(ym,debts){
  const occs=[];
  for(const d of debts){const o=occInMonth(d,ym);if(o)occs.push(o);}
  occs.sort(byDue);
  let total=0,paid=0,rest=0;for(const o of occs){total+=o.tot;paid+=o.paidEff;rest+=o.rest;}
  return {ym,occs,total,paid,rest};
}
function overdue(debts){const out=[],y=addDays(TODAY,-1);for(const d of debts)for(const o of occsThrough(d,y))if(o.late&&o.rest>0)out.push(o);return out.sort(byDue);}
function upcoming(debts,from,to){
  const out=[];if(to<from)return out;
  for(const d of debts)for(let ym=ymOf(from);ym<=ymOf(to);ym=ymAdd(ym,1)){const o=occInMonth(d,ym);if(o&&o.due>=from&&o.due<=to&&needsAction(o))out.push(o);}
  return out.sort(byDue);
}
function summary(d){
  const pays=PBYD.get(d.id)||[];
  let paidSum=0;for(const p of pays)paidSum+=p.amount;
  const pb=d.paidBefore||0;
  if(isFin(d)){
    const L=lastIdx(d);let plan=0,doneN=0,left=0,next=null,lateN=0,lateAmt=0;
    for(let n=1;n<=L;n++){
      const a=amtOf(d,n);
      if(n<=pb){doneN++;continue;}
      plan+=a;
      const o=occ(d,n);
      if(isDoneSt(o.st))doneN++;
      else{left++;if(o.late){lateN++;lateAmt+=o.rest;}else if(!next)next=o;}
    }
    return {fin:true,plan,paidSum,kalan:d.closedAt?0:Math.max(0,plan-paidSum),next,lateN,lateAmt,left:d.closedAt?0:left,doneN,last:dueOf(d,L),L};
  }
  const L=effLast(d);
  let lateN=0,lateAmt=0,next=null;
  for(let n=pb+1;n<=L&&n<=1200;n++){
    const o=occ(d,n);
    if(o.due<TODAY){if(o.late&&o.rest>0){lateN++;lateAmt+=o.rest;}continue;}
    if(needsAction(o)){next=o;break;}
  }
  return {fin:false,lateN,lateAmt,next,L,last:Number.isFinite(L)&&L>0?dueOf(d,L):null};
}
function isDone(d){const s=summary(d);if(s.fin)return !!d.closedAt||s.kalan===0;return !!(d.end&&d.end<TODAY)&&s.lateN===0;}
function totals(debts){
  let finRest=0,monthly=0,free=null;
  for(const d of debts){
    const s=summary(d);
    if(s.fin){if(!d.closedAt&&s.kalan>0){finRest+=s.kalan;if(!free||s.last>free)free=s.last;if(d.kind==='taksit')monthly+=d.amount;}}
    else if(!(d.end&&d.end<TODAY))monthly+=Math.round(curAmt(d)/(d.every||1));
  }
  return {finRest,monthly,free};
}
function shortPer(o){
  const d=o.d;
  if(d.kind==='taksit')return o.n+'. taksit / '+d.count;
  if(d.kind==='tek')return 'Tek ödeme';
  if(d.kind==='kart')return o.est?'Kart · tahmini tutar':'Kredi kartı';
  return d.every===1?'Her ay':(d.every+' ayda bir');
}

function wireDebtForm(){
  const f=$('#debt-form');if(!f)return;
  const edit=!!f.dataset.edit;
  const st={cat:null,nameFromPick:false};
  const modeV=()=>{const r=f.querySelector('input[name=mode]:checked');return r?r.value:f.dataset.mode;};
  function apply(){
    const m=modeV();
    f.querySelectorAll('[data-m]').forEach(el=>{el.hidden=el.dataset.m!==m;});
    if(!edit){
      const card=f.dataset.card==='1'&&m==='ay';
      $('#l-amount').textContent=card?'Ortalama aylık tutar ₺':m==='taksit'?'Taksit tutarı ₺':'Tutar ₺';
    }
    update();
  }
  function update(){
    const m=modeV(),amt=parseTL($('#f-amount').value),pv=$('#preview');
    if(m==='ay'&&!edit){
      const day=parseInt($('#f-day').value,10),row=$('#row-paidnow');
      if(day>=1&&day<=31){
        const cur=ymOf(TODAY),due=ymd(+cur.slice(0,4),+cur.slice(5,7),Math.min(day,dim(+cur.slice(0,4),+cur.slice(5,7))));
        row.hidden=!(due<TODAY);
        $('#l-paidnow').textContent=`Bu ayınkini (${dShort(due)}) ödedim`;
      }else row.hidden=true;
    }
    let x='';
    if(!(amt>0)&&!(f.dataset.card==='1'))x='Tutarı yazınca özet burada görünür.';
    else if(m==='ay'){const day=parseInt($('#f-day').value,10);x=day>=1&&day<=31?`Her ayın <b>${day}${gunEki(day)}</b> · <b>${money(amt||0)} ₺</b>${f.dataset.card==='1'?' (tutarı her ay değiştirebilirsin)':''}`:'Ayın kaçında ödediğini yaz.';}
    else if(m==='taksit'){
      const left=parseInt($('#f-left').value,10);
      if(left>=1&&amt>0){
        let lastTxt='';const nxt=edit?null:$('#f-next').value;
        if(nxt&&validDate(nxt))lastTxt=` · son taksit <b>${ymLabel(ymOf(addMonthsA(nxt,left-1,P(nxt).d)))}</b>`;
        else if(edit){const d=DMAP.get(f.dataset.edit),nx=d&&nextOpen(d);if(nx)lastTxt=` · son taksit <b>${ymLabel(ymOf(addMonthsA(nx.due,left-1,anchorOf(d))))}</b>`;}
        x=`<b>${left}</b> taksit × <b>${money(amt)} ₺</b> = <b>${money(left*amt)} ₺</b> kaldı${lastTxt}`;
      }else x='Taksit tutarını ve kaç taksit kaldığını yaz.';
    }
    else{const dt=$('#f-date').value;x=validDate(dt)?`<b>${esc(dLong(dt))}</b> · <b>${money(amt)} ₺</b>`:'Ödeme tarihini seç.';}
    pv.innerHTML=x;
  }
  f.addEventListener('click',e=>{
    const b=e.target.closest('[data-pick]');if(!b)return;
    const p=PICKS[+b.dataset.pick];if(!p)return;
    const nm=$('#f-name');
    if(!nm.value.trim()||st.nameFromPick){nm.value=p.name;st.nameFromPick=true;}
    st.cat=p.cat;f.dataset.card=p.card?'1':'';
    if(p.mode){const r=$('#m-'+p.mode);if(r)r.checked=true;}
    f.querySelectorAll('.pick').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
    apply();
    if(!nm.value.trim())nm.focus();else $('#f-amount').focus();
  });
  f.addEventListener('input',e=>{if(e.target.id==='f-name')st.nameFromPick=false;update();});
  f.addEventListener('change',e=>{if(e.target.name==='mode'){if(e.target.value!=='ay')f.dataset.card='';apply();}else update();});
  f.addEventListener('submit',e=>{e.preventDefault();saveDebt(f,st);});
  apply();
}
function setErr(id,msg){const e=$('#e-'+id),i=$('#f-'+id)||$('#'+id);if(e)e.textContent=msg||'';if(i){if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid');}}
function applyAmount(nd,orig,newAmt){
  const cy=ymOf(TODAY);
  if(newAmt===curAmt(orig))return;
  if(orig.kind==='tek'){nd.amount=newAmt;return;}
  if(orig.kind==='sabit'){
    let from=cy;const o=occInMonth(orig,cy);if(o&&isDoneSt(o.st))from=ymAdd(cy,1);
    if(ymOf(orig.first)>=from){nd.amount=newAmt;nd.steps=[];}
    else nd.steps=(orig.steps||[]).filter(s=>s.from<from).concat([{from,amount:newAmt}]);
    return;
  }
  const L=orig.kind==='taksit'?orig.count:Math.min(1200,idxAtOrBefore(orig,lastDayOf(cy)));
  nd.overrides=nd.overrides||{};
  for(let n=1;n<=L;n++){const o=occ(orig,n);if((isDoneSt(o.st)||ymOf(o.due)<cy)&&nd.overrides[n]==null)nd.overrides[n]=o.amt;}
  nd.amount=newAmt;
}
async function saveDebt(f,st){
  f.querySelectorAll('.err').forEach(e=>e.textContent='');
  f.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));
  const orig=f.dataset.edit?DMAP.get(f.dataset.edit):null;
  const mode=orig?modeOf(orig):(f.querySelector('input[name=mode]:checked')||{}).value||'ay';
  const name=$('#f-name').value.trim(),amount=parseTL($('#f-amount').value);
  const card=orig?orig.kind==='kart':(f.dataset.card==='1'&&mode==='ay');
  let ok=true;const bad=(id,msg)=>{setErr(id,msg);ok=false;};
  if(!name)bad('name','Bir ad yaz; ör. Kira.');
  if(!(amount>0)&&!card)bad('amount','Tutarı yaz; ör. 25.000');
  let day=null,left=null,next=null,date=null;
  if(mode==='ay'){day=parseInt($('#f-day').value,10);if(!(day>=1&&day<=31))bad('day','1 ile 31 arasında bir gün yaz.');}
  if(mode==='taksit'){
    left=parseInt($('#f-left').value,10);
    if(!orig){if(!(left>=1&&left<=600))bad('left','Kaç taksit kaldığını yaz.');next=$('#f-next').value;if(!validDate(next))bad('next','Sıradaki taksit tarihini seç.');}
    else if(!(left>=0&&left<=600))bad('left','Kaç taksit kaldığını yaz.');
  }
  if(mode==='tek'){date=$('#f-date').value;if(!validDate(date))bad('date','Ödeme tarihini seç.');}
  if(!ok){const e=f.querySelector('[aria-invalid="true"]');if(e){e.focus();e.scrollIntoView({block:'center'});}return;}
  const amt=Number.isFinite(amount)&&amount>0?amount:0;
  try{
    if(!orig){
      const cat=st.cat||(mode==='taksit'?'banka':card?'kart':mode==='tek'?'diger':'diger');
      const d={id:newId('b'),createdAt:Date.now(),overrides:{},steps:[],name,cat,prio:CATS[cat]||'onemli',book:'isletme',note:'',paidBefore:0,amount:amt};
      let paidNow=null;
      if(mode==='ay'){
        const cy=ymOf(TODAY),y=+cy.slice(0,4),m=+cy.slice(5,7);
        d.kind=card?'kart':'sabit';d.day=day;d.every=1;d.first=ymd(y,m,Math.min(day,dim(y,m)));
        const pn=$('#f-paidnow');
        if(d.first<TODAY&&pn&&pn.checked&&amt>0){paidNow={id:newId('o'),debtId:d.id,n:1,date:d.first,amount:amt,method:'banka',note:'',createdAt:Date.now()};if(card)d.overrides[1]=amt;}
      }else if(mode==='taksit'){d.kind='taksit';d.count=left;d.first=next;}
      else{d.kind='tek';d.count=1;d.first=date;}
      commit(D=>{D.debts[d.id]=debtDoc(cleanDebt(d.id,debtDoc(d))||d);if(paidNow)D.payments[paidNow.id]=payDoc(paidNow);});
      closeSheet();toast('Eklendi: '+name);
      if(S.tab!=='ay'){S.tab='ay';LS.set('tab','ay');}
      S.month=ymOf(TODAY);render();
      return;
    }
    const nd=clone(orig);nd.name=name;
    applyAmount(nd,orig,card&&!(amount>0)?orig.amount:amt);
    if(mode==='ay'&&day!==anchorOf(orig)){nd.day=day;const p=P(orig.first);nd.first=ymd(p.y,p.m,Math.min(day,dim(p.y,p.m)));}
    if(mode==='taksit'){const s=summary(orig);if(left!==s.left){nd.count=Math.max(s.doneN,1,orig.count+(left-s.left));}}
    if(mode==='tek')nd.first=date;
    commit(D=>{D.debts[nd.id]=debtDoc(nd);});
    closeSheet();toast('Kaydedildi');
  }catch(e){toast(errText(e));}
}

const DATA_KEY='borc-cizelgesi.v2';
function loadData(){try{const raw=localStorage.getItem(DATA_KEY);if(raw){const j=JSON.parse(raw);if(j&&typeof j==='object'&&j.debts&&j.payments)return j;}}catch(e){}return null;}
function persist(){try{localStorage.setItem(DATA_KEY,JSON.stringify(DATA));return true;}catch(e){return false;}}
function hydrate(){
  S.debts=Object.keys(DATA.debts).map(id=>cleanDebt(id,DATA.debts[id])).filter(Boolean);
  S.payments=Object.keys(DATA.payments).map(id=>cleanPay(id,DATA.payments[id])).filter(Boolean);

function commit(mut){
  const backup=JSON.stringify(DATA);

}

const IDB={

  async set(k,v){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>{db.close();rej(tx.error);};});}
};
let remT=0;
function pushReminders(){

    if(!('indexedDB' in window))return;

      const real=S.debts.filter(d=>!d.sample),items=[];
      for(const o of overdue(real))items.push({date:o.due,name:o.d.name,amount:o.rest});

async function registerPeriodic(){
  try{
    const reg=await navigator.serviceWorker.ready;
    if(!('periodicSync' in reg))return false;
    const st=await navigator.permissions.query({name:'periodic-background-sync'});
    if(st.state!=='granted')return false;
    await reg.periodicSync.register('borc-hatirlat',{minInterval:12*3600*1000});
    return true;
  }catch(e){return false;}
}
async function enableReminders(){
  if(!('Notification' in window)){toast('Bu telefon bildirim göstermiyor.');return;}
  let perm=Notification.permission;
  if(perm!=='granted'){try{perm=await Notification.requestPermission();}catch(e){}}
  if(perm!=='granted'){toast('Bildirim izni verilmedi. Telefon ayarlarından açabilirsin.');return;}
  const bg='serviceWorker' in navigator?await registerPeriodic():false;
  try{commit(D=>{D.settings=Object.assign({},D.settings,{remind:true,remindBg:bg});});}catch(e){toast(errText(e));return;}
  try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('Hatırlatmalar açık',{body:'Ödeme günü geldiğinde buraya bildirim gelir.',icon:'icons/icon-192.png',badge:'icons/badge-96.png',tag:'borc-test',lang:'tr'});}catch(e){}

function downloadFile(file){const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);}

  TODAY=localToday();applyTheme();
  $('#hdr-date').textContent=dLong(TODAY);
  $('#view').innerHTML=!S.debts.length?emptyHTML():S.tab==='borclar'?viewBorclar():viewAy();
  document.querySelectorAll('.tab[data-tab]').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}
function goTab(tab){S.tab=tab;LS.set('tab',tab);render();window.scrollTo(0,0);}

/* ───────── kısa bildirim ───────── */
let toastTimer=null,toastFn=null;
function toast(msg,act,fn){
  const el=$('#toast');
  el.innerHTML=`<span class="msg">${esc(msg)}</span>${act?`<button type="button" data-action="toast-act">${esc(act)}</button>`:''}`;
  el.hidden=false;toastFn=fn||null;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;toastFn=null;},act?6000:3200);
}
function armed(btn,label){
  if(btn.dataset.armed==='1'){btn.dataset.armed='';return true;}
  btn.dataset.armed='1';btn.dataset.orig=btn.innerHTML;btn.textContent=label;btn.classList.add('armed');
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed==='1'){btn.dataset.armed='';btn.innerHTML=btn.dataset.orig;btn.classList.remove('armed');}},4500);
  return false;
}
function installApp(){
  if(INSTALL){const ev=INSTALL;INSTALL=null;ev.prompt();ev.userChoice.then(c=>{if(c&&c.outcome==='accepted')LS.set('hideInstall',true);render();}).catch(()=>{});return;}
  openText('Uygulama olarak kur','Chrome\'da:',"1. Sağ üstteki üç noktaya (⋮) dokun.\n2. \"Uygulamayı yükle\" ya da \"Ana ekrana ekle\"ye dokun.\n3. \"Yükle\" de.\n\nSimge ana ekranına gelir; uygulamayı o simgeden aç.");
}

/* ───────── olaylar ───────── */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action],.tab[data-tab]');if(!t)return;
  if(t.matches('.tab[data-tab]')&&!t.dataset.action){goTab(t.dataset.tab);return;}
  const a=t.dataset.action,id=t.dataset.id,n=t.dataset.n!=null?parseInt(t.dataset.n,10):null;
  switch(a){
    case 'add':openSheet('debt',{});break;
    case 'menu':openSheet('menu',{});break;
    case 'month':S.month=ymAdd(S.month,+t.dataset.k);render();break;
    case 'month-today':S.month=ymOf(TODAY);render();break;
    case 'occ':openSheet('occ',{id,n});break;
    case 'toggle':togglePaid(id,n);break;
    case 'edit':if(SHEET)closeSheet();openSheet('debt',{id});break;
    case 'del-debt':if(armed(t,'Ödemeleriyle silinecek · emin misin?')){const d=DMAP.get(id);try{commit(D=>{for(const k of Object.keys(D.payments))if(D.payments[k].debtId===id)delete D.payments[k];delete D.debts[id];});closeSheet();toast('Silindi: '+(d?d.name:''));}catch(err){toast(errText(err));}}break;
    case 'sheet-close':closeSheet();break;
    case 'share-month':shareText(monthText(S.month),'Ödeme listesi');break;
    case 'backup':doBackup();break;
    case 'imp-go':runImport();break;
    case 'imp-cancel':IMPORT=null;refreshSheet();break;
    case 'del-samples':if(armed(t,'Örnekler silinecek · emin misin?'))deleteSamples();break;
    case 'del-all':if(armed(t,'Her şey silinecek · emin misin?'))deleteAll();break;
    case 'theme':try{commit(D=>{D.settings=Object.assign({},D.settings,{theme:t.dataset.v});});}catch(err){toast(errText(err));}break;
    case 'remind-on':enableReminders();break;
    case 'remind-off':disableReminders();break;
    case 'install':installApp();break;
    case 'hide-install':LS.set('hideInstall',true);render();break;
    case 'select-text':{const ta=$('#t-text');if(ta){ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(err){}}break;}
    case 'toast-act':{const fn=toastFn;toastFn=null;$('#toast').hidden=true;if(fn){try{fn();toast('Geri alındı');}catch(err){toast(errText(err));}}break;}
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='ov-form'){e.preventDefault();saveOverride();}});
document.addEventListener('change',e=>{if(e.target.id==='imp-file'&&e.target.files&&e.target.files[0])readImport(e.target.files[0]);});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('amt-in')&&t.value.trim()){const k=parseTL(t.value);if(Number.isFinite(k)&&k>=0)t.value=fmt(k);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet();});
document.addEventListener('toggle',e=>{const k=e.target&&e.target.dataset&&e.target.dataset.k;if(k)S[k]=e.target.open;},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&localToday()!==TODAY){render();pushReminders();}});
window.addEventListener('storage',e=>{if(e.key===DATA_KEY){const d=loadData();if(d){DATA=d;hydrate();onData();}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;render();});
window.addEventListener('appinstalled',()=>{INSTALL=null;LS.set('hideInstall',true);toast('Uygulama telefonuna kuruldu');render();});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme());}catch(e){}

/* ───────── açılış ───────── */
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',ICON[el.dataset.icon]));
DATA=loadData();
if(!DATA){const s=sampleData();DATA={v:2,debts:s.debts,payments:s.pays,settings:{},meta:{created:Date.now()}};persist();}
DATA.debts=DATA.debts||{};DATA.payments=DATA.payments||{};DATA.meta=DATA.meta||{};
hydrate();
const qs=new URLSearchParams(location.search);
const qTab=qs.get('sekme');
S.tab=qTab==='borclar'?'borclar':(LS.get('tab','ay')==='borclar'?'borclar':'ay');
render();
if(qs.get('yeni'))openSheet('debt',{});
if(qs.toString()){try{history.replaceState(null,'',location.pathname);}catch(e){}}
pushReminders();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(()=>{if(S.settings.remind&&!S.settings.remindBg)registerPeriodic().then(ok=>{if(ok){try{commit(D=>{D.settings=Object.assign({},D.settings,{remindBg:true});});}catch(e){}}});}).catch(()=>{});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{});});}catch(e){}
})();
</script>
</body>
</html>
